<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
    <style>
        .stat-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            gap: 18px;
            transition: all var(--transition);
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--card-shadow-lg); }
        .stat-icon {
            width: 52px; height: 52px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; background: #f1f5f9;
        }
        .stat-icon svg {
            width: 26px; height: 26px; stroke: #0f172a; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .stat-value { font-size: 1.8rem; font-weight: 800; line-height: 1.1; color: var(--text-primary); }
        .stat-label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
        .stat-trend { font-size: 0.72rem; font-weight: 700; margin-top: 6px; display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; }
        .stat-trend.up { background: var(--success-light); color: #065f46; }
        .stat-trend.down { background: var(--danger-light); color: #991b1b; }
    </style>
</head>
<body>
<div class="header">
    <h1>Sunrise Dental Clinic</h1>
    <div class="user-info" id="user-info"></div>
</div>
<div class="sticky-nav">
    <nav class="nav" id="main-nav"></nav>
</div>

<div class="container">
    <div id="toast-container"></div>

    <div class="page-header">
        <div>
            <h2>Admin Dashboard</h2>
            <p>Full system overview and management access</p>
        </div>
        <span id="current-date" style="color:var(--text-muted);font-size:0.875rem;"></span>
    </div>

    <!-- Stats -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:28px;">
        <div class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div><div class="stat-value" id="stat-patients">–</div><div class="stat-label">Total Patients</div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
            <div><div class="stat-value" id="stat-appointments">–</div><div class="stat-label">Total Appointments</div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            </div>
            <div><div class="stat-value" id="stat-revenue">–</div><div class="stat-label">Today's Revenue</div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C8 2 4 5 4 9c0 2 1 3 2 4l-1 7c0 1 1 2 2 2h10c1 0 2-1 2-2l-1-7c1-1 2-2 2-4 0-4-4-7-8-7z"/></svg>
            </div>
            <div><div class="stat-value" id="stat-dentists">–</div><div class="stat-label">Active Dentists</div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div><div class="stat-value" id="stat-pending">–</div><div class="stat-label">Pending Bills</div></div>
        </div>
    </div>

    <!-- Today's Appointments -->
    <div class="card" style="margin-bottom:24px;">
        <div class="section-title">Today's Appointments</div>
        <div class="table-wrapper">
            <table class="table" id="todayTable">
                <thead><tr><th>No</th><th>Patient</th><th>Dentist</th><th>Treatment</th><th>Time</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody><tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted);">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
    requireAuth(['ADMIN', 'SYSTEM_ADMIN']);
    document.getElementById('current-date').textContent =
        new Date().toLocaleDateString('en-LK', {weekday:'long',year:'numeric',month:'long',day:'numeric'});

    function getStatusBadge(status) {
        const cls = 'status-' + String(status).toLowerCase().replace(/[^a-z0-9]+/g, '-');
        return '<span class="status-badge ' + cls + '">' + status + '</span>';
    }

    async function loadDashboard() {
        try {
            const [appointments, patients, dentists, bills] = await Promise.all([
                apiGet('/appointments'), apiGet('/patients'), apiGet('/dentists'), apiGet('/bills')
            ]);
            const patientMap = {}; patients.forEach(p => patientMap[p.patientId] = p.name);
            const dentistMap = {}; dentists.forEach(d => dentistMap[d.dentistId] = d.name);

            document.getElementById('stat-patients').textContent = patients.length;
            document.getElementById('stat-appointments').textContent = appointments.length;
            document.getElementById('stat-dentists').textContent = dentists.filter(d => d.active).length;
            const rev = await apiGet('/reports/revenue/daily');
            document.getElementById('stat-revenue').textContent = (rev.revenue || 0).toLocaleString('en-LK', {minimumFractionDigits: 2});
            document.getElementById('stat-pending').textContent = bills.filter(b => b.paymentStatus === 'PENDING').length;

            const today = new Date().toISOString().split('T')[0];
            const todayAppts = appointments.filter(a => a.appointmentDate === today).sort((a,b) => (a.appointmentTime||'').localeCompare(b.appointmentTime||''));
            const tbody = document.querySelector('#todayTable tbody');
            tbody.innerHTML = todayAppts.map(a => `<tr>
                <td><strong>${a.appointmentNo}</strong></td>
                <td>${patientMap[a.patientId] || 'ID: '+a.patientId}</td>
                <td>${dentistMap[a.dentistId] || 'Dr. #'+a.dentistId}</td>
                <td>${a.treatmentType}</td>
                <td>${a.appointmentTime ? a.appointmentTime.substring(0,5) : ''}</td>
                <td>${getStatusBadge(a.status)}</td>
                <td style="display:flex;gap:6px;">
                    <a href="/Frontend/view-appointment.html?no=${a.appointmentNo}" class="btn btn-sm btn-ghost">View</a>
                </td>
            </tr>`).join('') || '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted);">No appointments today</td></tr>';
        } catch (e) { showToast('Failed to load dashboard', 'error'); }
    }

    loadDashboard();
</script>
</body>
</html>
