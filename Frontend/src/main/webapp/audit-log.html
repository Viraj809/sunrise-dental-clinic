<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Log – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
</head>
<body>
<div class="header">
    <h1>Sunrise Dental Clinic</h1>
    <div class="user-info" id="user-info"></div>
</div>
<nav class="nav" id="main-nav"></nav>

<div class="container">
    <div id="toast-container"></div>
    <div class="page-header">
        <div><h2>🛡️ Audit Log</h2><p>Track all system activity</p></div>
    </div>

    <div class="card">
        <h2>Recent Activity</h2>
        <div class="table-wrapper">
            <table class="table" id="auditTable">
                <thead><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Description</th></tr></thead>
                <tbody><tr><td colspan="5" class="empty-state" style="padding:30px;text-align:center;color:var(--text-muted);">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
    requireAuth(['ADMIN', 'SYSTEM_ADMIN']);
    async function load() {
        const list = await apiGet('/audit?limit=200');
        const tbody = document.querySelector('#auditTable tbody');
        if (!list || list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--text-muted);">No audit records</td></tr>';
            return;
        }
        tbody.innerHTML = list.map(a => `<tr>
            <td>${a.performedAt ? a.performedAt.replace('T',' ').substring(0,19) : '-'}</td>
            <td>${a.performedBy || '-'}</td>
            <td>${a.role || '-'}</td>
            <td><span class="badge status-${String(a.actionType).toLowerCase()}">${a.actionType}</span></td>
            <td>${a.description || '-'}</td>
        </tr>`).join('');
    }
    load();
</script>
</body>
</html>
