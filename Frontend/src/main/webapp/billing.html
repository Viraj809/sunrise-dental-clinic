<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
</head>
<body>
    <div class="header">
        <h1>Billing</h1>
    </div>
    <nav class="nav" id="main-nav"></nav>
    <div class="container" style="max-width:700px;">
        <div id="toast-container"></div>
        <div class="card">
            <h2>Generate Bill</h2>
            <form id="billForm">
                <div class="form-group">
                    <label>Appointment ID *</label>
                    <input type="number" id="appointmentId" required>
                </div>
                <div class="form-group">
                    <label>Patient ID *</label>
                    <input type="number" id="patientId" required>
                </div>
                <button type="submit" class="btn btn-primary">Generate Bill</button>
            </form>
        </div>
        <div id="billResult" class="card" style="display:none;">
            <h2>Bill Receipt</h2>
            <div id="billDetails"></div>
            <button class="btn btn-primary no-print" onclick="window.print()">Print Bill</button>
        </div>
    </div>
    <script src="/Frontend/js/app.js"></script>
    <script>
        document.getElementById('billForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = {
                appointment_id: parseInt(document.getElementById('appointmentId').value),
                patient_id: parseInt(document.getElementById('patientId').value)
            };
            try {
                const res = await apiPost('/bills/generate', data);
                if (!res.error) {
                    showBill(res);
                    showToast('Bill generated successfully');
                } else {
                    showToast(res.error, 'error');
                }
            } catch (e) { showToast('Failed to generate bill', 'error'); }
        });

        function showBill(b) {
            document.getElementById('billResult').style.display = 'block';
            document.getElementById('billDetails').innerHTML =
                '<p><strong>Bill ID:</strong> ' + b.bill_id + '</p>' +
                '<p><strong>Appointment ID:</strong> ' + b.appointment_id + '</p>' +
                '<p><strong>Consultation Fee:</strong> LKR ' + b.consultation_fee.toFixed(2) + '</p>' +
                '<p><strong>Treatment Fee:</strong> LKR ' + b.treatment_fee.toFixed(2) + '</p>' +
                '<p><strong>Discount:</strong> LKR ' + b.discount.toFixed(2) + '</p>' +
                '<p><strong>Tax:</strong> LKR ' + b.tax.toFixed(2) + '</p>' +
                '<p><strong>Total Amount:</strong> LKR ' + b.total_amount.toFixed(2) + '</p>' +
                '<p><strong>Payment Method:</strong> ' + b.payment_method + '</p>' +
                '<p><strong>Payment Status:</strong> ' + b.payment_status + '</p>' +
                '<p><strong>Issued At:</strong> ' + b.issued_at + '</p>';
        }
    </script>
</body>
</html>
