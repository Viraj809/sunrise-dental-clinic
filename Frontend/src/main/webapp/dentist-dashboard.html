<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dentist Dashboard – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
    <style>
        .stat-card {
            background: var(--surface); border-radius: var(--radius-lg); padding: 22px;
            border: 1px solid var(--border); box-shadow: var(--card-shadow);
            display: flex; align-items: center; gap: 18px; transition: all var(--transition);
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--card-shadow-lg); }
        .stat-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
        .stat-icon.blue { background: var(--primary-light); }
        .stat-icon.green { background: var(--success-light); }
        .stat-icon.amber { background: var(--warning-light); }
        .stat-value { font-size: 1.8rem; font-weight: 800; line-height: 1.1; color: var(--text-primary); }
        .stat-label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

        .quick-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
        .qa-btn {
            background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
            padding: 14px 12px; text-decoration: none; color: inherit; display: flex; align-items: center;
            gap: 10px; transition: all var(--transition); box-shadow: var(--card-shadow); font-size: 0.85rem; font-weight: 600;
        }
        .qa-btn:hover { border-color: var(--primary); background: var(--primary-light); transform: translateY(-2px); box-shadow: var(--card-shadow-lg); }
        .qa-icon { font-size: 1.3rem; width: 38px; height: 38px; border-radius: 10px; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        .notice-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 16px 20px; margin-bottom: 12px; box-shadow: var(--card-shadow); transition: all var(--transition);
        }
        .notice-card.unread { background: var(--primary-light); border-color: var(--primary); }
        .notice-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; color: var(--text-primary); }
        .notice-desc { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .notice-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.78rem; color: var(--text-muted); }
        .notice-badge { display: inline-flex; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
        .notice-badge.urgent { background: var(--danger-light); color: var(--danger); }
        .notice-badge.important { background: var(--warning-light); color: var(--warning); }
        .notice-badge.general { background: var(--info-light); color: var(--info); }

        .section-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
<div class="header">
    <h1 style="cursor:pointer;" onclick="goToDashboard()">Sunrise Dental Clinic</h1>
    <div class="user-info" id="user-info"></div>
</div>
<div class="sticky-nav">
    <nav class="nav" id="main-nav"></nav>
</div>

<div class="container">
    <div id="toast-container"></div>

    <div class="page-header">
        <div>
            <h2 id="greeting">Welcome, Doctor!</h2>
            <p>Here's your schedule for today.</p>
        </div>
        <span id="current-date" style="color:var(--text-muted);font-size:0.875rem;"></span>
    </div>

    <!-- Stats -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px;">
        <div class="stat-card">
            <div class="stat-icon blue">📅</div>
            <div><div class="stat-value" id="stat-today">–</div><div class="stat-label">Today's Patients</div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon green">✅</div>
            <div><div class="stat-value" id="stat-done">–</div><div class="stat-label">Completed</div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon amber">⏳</div>
            <div><div class="stat-value" id="stat-pending">–</div><div class="stat-label">Remaining</div></div>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="card" style="margin-bottom:24px;">
        <div class="section-title">Quick Actions</div>
        <div class="quick-actions">
            <a href="/Frontend/dentist-schedule.html" class="qa-btn"><span class="qa-icon">📋</span> My Schedule</a>
            <a href="/Frontend/patient-history.html" class="qa-btn"><span class="qa-icon">📁</span> Patient History</a>
            <a href="/Frontend/reports.html" class="qa-btn"><span class="qa-icon">📊</span> Reports</a>
            <a href="/Frontend/help.html" class="qa-btn"><span class="qa-icon">❓</span> Help</a>
        </div>
    </div>

    <!-- Today's Appointments -->
    <div class="card" style="margin-bottom:24px;">
        <div class="section-title">My Appointments</div>
        <div id="scheduleDate" style="margin-bottom:12px;"><span style="font-size:0.875rem;color:var(--text-muted);">Date: </span><strong id="todayStr"></strong></div>
        <div class="table-wrapper">
            <table class="table" id="scheduleTable">
                <thead><tr><th>Appointment No</th><th>Patient Name</th><th>Date</th><th>Time</th><th>Treatment</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody><tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted);">Loading schedule...</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- New Notice Notification -->
    <div class="card" style="margin-bottom:24px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <div class="section-title" style="margin-bottom:0;">Notices <span id="noticeUnreadBadge" style="display:none;"></span></div>
        </div>
        <div id="noticeList" style="margin-top:12px;"></div>
    </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
    requireAuth(['DENTIST', 'ADMIN', 'SYSTEM_ADMIN']);
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('todayStr').textContent = new Date().toLocaleDateString('en-LK', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
    document.getElementById('current-date').textContent = document.getElementById('todayStr').textContent;
    const name = localStorage.getItem('name') || 'Doctor';
    document.getElementById('greeting').textContent = 'Welcome, ' + name + '! Here\'s your schedule for today.';

    function getStatusBadge(status) {
        const cls = 'status-' + String(status).toLowerCase().replace(/[^a-z0-9]+/g, '-');
        return '<span class="status-badge ' + cls + '">' + status + '</span>';
    }

    let todayAppointments = [];

    async function loadSchedule() {
        try {
            const role = localStorage.getItem('role');
            let myAppointments = [];
            if (role === 'DENTIST') {
                myAppointments = await apiGet('/appointments/mine');
            } else {
                const all = await apiGet('/appointments');
                const dentists = await apiGet('/dentists');
                const email = (localStorage.getItem('email') || '').toLowerCase();
                const me = dentists.find(d => (d.email || '').toLowerCase() === email);
                const myDentistId = me ? me.dentistId : null;
                myAppointments = myDentistId ? all.filter(a => a.dentistId === myDentistId) : all;
            }
            let todayAppts = myAppointments.filter(a => a.appointmentDate === today);
            todayAppointments = todayAppts;
            const done = todayAppts.filter(a => a.status === 'Completed').length;
            const pending = todayAppts.filter(a => a.status !== 'Completed' && a.status !== 'Cancelled').length;
            document.getElementById('stat-today').textContent = todayAppts.length;
            document.getElementById('stat-done').textContent = done;
            document.getElementById('stat-pending').textContent = pending;

            const dentists = await apiGet('/dentists');
            const patients = await apiGet('/patients');
            const dentistMap = {}; dentists.forEach(d => dentistMap[d.dentistId] = d.name);
            const patientMap = {}; patients.forEach(p => patientMap[p.patientId] = p.name);

            const tbody = document.querySelector('#scheduleTable tbody');
            if (!todayAppts.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted);">No appointments scheduled for today</td></tr>'; }
            else {
                tbody.innerHTML = todayAppts.sort((a,b) => (a.appointmentTime||'').localeCompare(b.appointmentTime||'')).map(a => {
                    const canAct = a.status !== 'Completed' && a.status !== 'Cancelled';
                    const actionBtns = canAct
                        ? `<button class="btn btn-sm btn-success" onclick="confirmStatus(${a.appointmentId}, 'Completed')">Completed</button>
                           <button class="btn btn-sm btn-danger" onclick="confirmStatus(${a.appointmentId}, 'Cancelled')">Cancelled</button>`
                        : `<span style="font-size:0.8rem;color:var(--text-muted);">${a.status}</span>`;
                    return `<tr>
                        <td><strong>${a.appointmentNo}</strong></td>
                        <td>${patientMap[a.patientId] || 'Patient #'+a.patientId}</td>
                        <td>${a.appointmentDate}</td>
                        <td>${a.appointmentTime ? a.appointmentTime.substring(0,5) : ''}</td>
                        <td>${a.treatmentType}</td>
                        <td>${getStatusBadge(a.status)}</td>
                        <td style="display:flex;gap:6px;flex-wrap:wrap;">${actionBtns}</td>
                    </tr>`;
                }).join('');
            }
        } catch (e) { showToast('Failed to load schedule', 'error'); }
    }

    async function confirmStatus(appointmentId, status) {
        const msg = status === 'Completed'
            ? 'Are you sure you want to mark this appointment as Completed?'
            : 'Are you sure you want to cancel this appointment?';
        if (!confirm(msg)) return;
        try {
            await apiPut('/appointments/' + appointmentId + '/status', {status: status});
            showToast('Appointment marked as ' + status.toLowerCase() + ' ✅');
            loadSchedule();
        } catch (e) { showToast('Failed to update status', 'error'); }
    }

    async function loadNotices() {
        const container = document.getElementById('noticeList'); if (!container) return;
        try {
            const notices = await apiGet('/notices/my');
            if (!notices || !notices.length) { container.innerHTML = '<div class="empty-state"><p>No notices available</p></div>'; return; }
            const readIds = (function() {
                try { return JSON.parse(localStorage.getItem('readNoticeIds') || '[]'); } catch (e) { return []; }
            })();
            container.innerHTML = notices.map(n => {
                const isRead = readIds.includes(n.noticeId);
                const badgeColor = n.priority === 'Urgent' ? 'var(--danger)' : n.priority === 'Important' ? 'var(--warning)' : 'var(--info)';
                const badgeBg = n.priority === 'Urgent' ? 'var(--danger-light)' : n.priority === 'Important' ? 'var(--warning-light)' : 'var(--info-light)';
                return '<div class="notice-card ' + (isRead ? '' : 'unread') + '"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;"><strong style="font-size:1rem;">' + (n.title||'') + '</strong><span style="background:' + badgeBg + ';color:' + badgeColor + ';padding:3px 10px;border-radius:20px;font-size:0.75rem;font-weight:700;">' + (n.priority||'General') + '</span></div><p style="color:var(--text-secondary);font-size:0.9rem;margin:8px 0;">' + (n.description ? n.description.substring(0, 200) + (n.description.length > 200 ? '...' : '') : '') + '</p><div style="font-size:0.8rem;color:var(--text-muted);display:flex;gap:16px;flex-wrap:wrap;"><span>Published: ' + (n.publishDate||'-') + '</span><span>Expires: ' + (n.expiryDate||'-') + '</span></div>' + (!isRead ? '<button class="btn btn-sm btn-primary" onclick="markNoticeRead(' + n.noticeId + ')" style="margin-top:10px;">Mark as Read</button>' : '<span style="font-size:0.8rem;color:var(--success);margin-top:10px;display:inline-block;">Read</span>') + '</div>';
            }).join('');
        } catch (e) { showToast('Failed to load notices', 'error'); }
    }

    async function markNoticeRead(id) {
        try {
            const readIds = (function() {
                try { return JSON.parse(localStorage.getItem('readNoticeIds') || '[]'); } catch (e) { return []; }
            })();
            if (!readIds.includes(id)) {
                readIds.push(id);
                localStorage.setItem('readNoticeIds', JSON.stringify(readIds));
            }
            showToast('Notice marked as read');
            loadNotices();
            loadUnreadCount();
        } catch (e) { showToast('Failed','error'); }
    }

    async function loadUnreadCount() {
        try {
            const notices = await apiGet('/notices/my');
            const readIds = (function() {
                try { return JSON.parse(localStorage.getItem('readNoticeIds') || '[]'); } catch (e) { return []; }
            })();
            const unread = notices.filter(n => !readIds.includes(n.noticeId)).length;
            const badge = document.getElementById('noticeUnreadBadge');
            if (unread > 0) { badge.textContent = unread + ' New'; badge.style.display = 'inline'; badge.style.background = 'var(--danger-light)'; badge.style.color = 'var(--danger)'; badge.style.padding = '3px 10px'; badge.style.borderRadius = '20px'; badge.style.fontSize = '0.75rem'; badge.style.fontWeight = '700'; }
            else { badge.style.display = 'none'; }
        } catch (e) {}
    }

    function goToDashboard() {
        const role = localStorage.getItem('role');
        if (role === 'ADMIN' || role === 'SYSTEM_ADMIN') {
            window.location.href = '/Frontend/admin-dashboard.html';
        } else if (role === 'RECEPTIONIST') {
            window.location.href = '/Frontend/receptionist-dashboard.html';
        } else if (role === 'DENTIST') {
            window.location.href = '/Frontend/dentist-dashboard.html';
        }
    }

    loadSchedule(); loadNotices(); loadUnreadCount();
</script>
</body>
</html>
