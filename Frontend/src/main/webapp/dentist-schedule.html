<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
    <style>
        .stat-card {
            background: var(--surface); border-radius: var(--radius-lg); padding: 22px;
            border: 1px solid var(--border); box-shadow: var(--card-shadow);
            display: flex; align-items: center; gap: 18px; transition: all var(--transition);
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--card-shadow-lg); }
        .stat-icon {
            width: 52px; height: 52px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; background: #f1f5f9;
        }
        .stat-icon svg {
            width: 26px; height: 26px; stroke: #0f172a; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .stat-value { font-size: 1.8rem; font-weight: 800; line-height: 1.1; color: var(--text-primary); }
        .stat-label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
        .section-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
<div class="header">
    <h1 style="cursor:pointer;" onclick="goToDashboard()">Sunrise Dental Clinic</h1>
    <div class="user-info" id="user-info"></div>
</div>
<div class="sticky-nav">
    <nav class="nav" id="main-nav"></nav>
</div>

<div class="container">
    <div id="toast-container"></div>

    <div class="page-header">
        <div>
            <h2>My Appointments</h2>
            <p>View and manage your assigned appointments</p>
        </div>
        <span id="current-date" style="color:var(--text-muted);font-size:0.875rem;"></span>
    </div>

    <!-- Filters -->
    <div class="card" style="margin-bottom:20px;">
        <div class="form-row">
            <div class="form-group">
                <label>Filter by Date</label>
                <input type="date" id="dateFilter" onchange="loadAppointments()">
            </div>
            <div class="form-group">
                <label>Filter by Status</label>
                <select id="statusFilter" onchange="loadAppointments()">
                    <option value="">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="Scheduled">Scheduled</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Stats -->
    <div id="statsRow" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px;">
        <div class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
            <div><div class="stat-value" id="s-total">0</div><div class="stat-label">Total</div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <div><div class="stat-value" id="s-completed">0</div><div class="stat-label">Completed</div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div><div class="stat-value" id="s-pending">0</div><div class="stat-label">Pending</div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
            <div><div class="stat-value" id="s-cancelled">0</div><div class="stat-label">Cancelled</div></div>
        </div>
    </div>

    <!-- Appointments Table -->
    <div class="card">
        <div class="section-title">My Appointments</div>
        <div class="table-wrapper">
            <table class="table" id="apptTable">
                <thead>
                    <tr><th>Appointment No</th><th>Patient Name</th><th>Date</th><th>Time</th><th>Treatment</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody><tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted);">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
    requireAuth(['DENTIST', 'ADMIN', 'SYSTEM_ADMIN']);
    document.getElementById('current-date').textContent =
        new Date().toLocaleDateString('en-LK', {weekday:'long',year:'numeric',month:'long',day:'numeric'});

    function getStatusBadge(status) {
        const cls = 'status-' + String(status).toLowerCase().replace(/[^a-z0-9]+/g, '-');
        return '<span class="status-badge ' + cls + '">' + status + '</span>';
    }

    async function loadAppointments() {
        try {
            let appointments = [];
            const role = localStorage.getItem('role');
            if (role === 'DENTIST') {
                appointments = await apiGet('/appointments/mine');
            } else {
                const all = await apiGet('/appointments');
                const dentists = await apiGet('/dentists');
                const email = (localStorage.getItem('email') || '').toLowerCase();
                const me = dentists.find(d => (d.email || '').toLowerCase() === email);
                const myDentistId = me ? me.dentistId : null;
                appointments = myDentistId ? all.filter(a => a.dentistId === myDentistId) : [];
            }

            const dateFilter = document.getElementById('dateFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            if (dateFilter) appointments = appointments.filter(a => a.appointmentDate === dateFilter);
            if (statusFilter) appointments = appointments.filter(a => a.status === statusFilter);

            appointments.sort((a, b) => {
                const dateA = a.appointmentDate || '';
                const dateB = b.appointmentDate || '';
                if (dateA !== dateB) return dateA.localeCompare(dateB);
                return (a.appointmentTime || '').localeCompare(b.appointmentTime || '');
            });

            document.getElementById('s-total').textContent = appointments.length;
            document.getElementById('s-completed').textContent = appointments.filter(a => a.status === 'Completed').length;
            document.getElementById('s-pending').textContent = appointments.filter(a => a.status !== 'Completed' && a.status !== 'Cancelled').length;
            document.getElementById('s-cancelled').textContent = appointments.filter(a => a.status === 'Cancelled').length;

            const dentists = await apiGet('/dentists');
            const patients = await apiGet('/patients');
            const dentistMap = {}; dentists.forEach(d => dentistMap[d.dentistId] = d.name);
            const patientMap = {}; patients.forEach(p => patientMap[p.patientId] = p.name);

            const tbody = document.querySelector('#apptTable tbody');
            if (!appointments.length) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted);">No appointments found</td></tr>';
                return;
            }

            tbody.innerHTML = appointments.map(a => {
                const canAct = a.status !== 'Completed' && a.status !== 'Cancelled';
                const actionBtns = canAct
                    ? `<button class="btn btn-sm btn-success" onclick="confirmStatus(${a.appointmentId}, 'Completed')">Completed</button>
                       <button class="btn btn-sm btn-danger" onclick="confirmStatus(${a.appointmentId}, 'Cancelled')">Cancelled</button>`
                    : `<span style="font-size:0.8rem;color:var(--text-muted);">${a.status}</span>`;
                return `<tr>
                    <td><strong>${a.appointmentNo}</strong></td>
                    <td>${patientMap[a.patientId] || 'Patient #' + a.patientId}</td>
                    <td>${a.appointmentDate}</td>
                    <td>${a.appointmentTime ? a.appointmentTime.substring(0,5) : ''}</td>
                    <td>${a.treatmentType}</td>
                    <td>${getStatusBadge(a.status)}</td>
                    <td style="display:flex;gap:6px;flex-wrap:wrap;">${actionBtns}</td>
                </tr>`;
            }).join('');
        } catch (e) { showToast('Failed to load appointments', 'error'); }
    }

    async function confirmStatus(appointmentId, status) {
        const msg = status === 'Completed'
            ? 'Are you sure you want to mark this appointment as Completed?'
            : 'Are you sure you want to cancel this appointment?';
        if (!confirm(msg)) return;
        try {
            await apiPut('/appointments/' + appointmentId + '/status', {status: status});
            showToast('Appointment marked as ' + status.toLowerCase() + ' ✅');
            loadAppointments();
        } catch (e) { showToast('Failed to update status', 'error'); }
    }

    function goToDashboard() {
        const role = localStorage.getItem('role');
        if (role === 'ADMIN' || role === 'SYSTEM_ADMIN') {
            window.location.href = '/Frontend/admin-dashboard.html';
        } else if (role === 'RECEPTIONIST') {
            window.location.href = '/Frontend/receptionist-dashboard.html';
        } else if (role === 'DENTIST') {
            window.location.href = '/Frontend/dentist-dashboard.html';
        }
    }

    loadAppointments();
</script>
</body>
</html>
