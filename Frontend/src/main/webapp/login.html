<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #f8fafc;
        }
        
        .login-page {
            min-height: 100vh;
            display: flex;
        }

        /* ── Left Side: Image Background Panel ── */
        .brand-panel {
            flex: 1.2;
            position: relative;
            /* ඔයාගේ image folder එකේ තියෙන රූපය මෙතනින් load වේවි */
            background: url('/Frontend/image/img.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            color: white;
        }

        /* Image එක උඩින් නිල් පාට Overlay එකක් (අකුරු පැහැදිලිව පේන්න) */
        .brand-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.9) 0%, rgba(37, 99, 235, 0.6) 100%);
        }

        .brand-content {
            position: relative;
            z-index: 1;
            max-width: 500px;
        }

        .brand-logo-icon {
            font-size: 3.5rem;
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px; height: 90px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .brand-content h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 0 0 15px 0;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .brand-content p {
            font-size: 1.15rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        /* ── Right Side: Login Form Panel ── */
        .form-panel {
            flex: 1;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
        }

        .login-card h2 {
            font-size: 2.2rem;
            color: #0f172a;
            margin: 0 0 8px 0;
            font-weight: 800;
        }

        .login-card .sub {
            color: #64748b;
            margin: 0 0 35px 0;
            font-size: 1.05rem;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            background: #f8fafc;
            color: #0f172a;
        }

        .form-group input:focus {
            border-color: #2563eb;
            background: #ffffff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            font-size: 1.2rem;
            padding: 5px;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.2);
        }

        .btn-login:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 24px;
            font-size: 0.95rem;
            border: 1px solid #fecaca;
            display: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .login-foot {
            text-align: center;
            margin-top: 35px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* Mobile View Response */
        @media (max-width: 900px) {
            .login-page { flex-direction: column; }
            .brand-panel { flex: none; padding: 60px 20px; text-align: center; }
            .brand-content { margin: 0 auto; }
            .brand-logo-icon { width: 70px; height: 70px; font-size: 2.5rem; margin-bottom: 15px; }
            .brand-content h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="login-page">
        <!-- ── Image Panel ── -->
        <aside class="brand-panel">
            <div class="brand-content">
                <div class="brand-logo-icon">🦷</div>
                <h1>Sunrise<br>Dental Clinic</h1>
                <p>Welcome to our modern dental management system. Seamlessly manage appointments, patient records, and treatments in one secure place.</p>
            </div>
        </aside>

        <!-- ── Login Form ── -->
        <main class="form-panel">
            <div class="login-card">
                <h2>Welcome Back</h2>
                <p class="sub">Sign in to access your dashboard.</p>

                <div id="error-msg" class="error-msg" style="display: none;">
                    ⚠️ <span id="error-text"></span>
                </div>

                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="name@sunrisedental.lk" autocomplete="email">
                    </div>
                    
                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-container">
                            <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
                            <button type="button" class="password-toggle" onclick="togglePassword()">👁️</button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-login" id="submitBtn">Sign In</button>
                </form>

                <p class="login-foot">© 2026 Sunrise Dental Clinic · Sri Lanka</p>
            </div>
        </main>
    </div>

    <script>
        // Redirect if already logged in
        (function() {
            const token = localStorage.getItem('token');
            const role  = localStorage.getItem('role');
            if (token && role) {
                const userRole = role.toUpperCase();
                if (userRole === 'SYSTEM_ADMIN' || userRole === 'ADMIN') window.location.href = '/Frontend/admin-dashboard.html';
                else if (userRole === 'RECEPTIONIST') window.location.href = '/Frontend/receptionist-dashboard.html';
                else if (userRole === 'DENTIST')      window.location.href = '/Frontend/dentist-dashboard.html';
                else if (userRole === 'PATIENT')      window.location.href = '/Frontend/patient-dashboard.html';
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn      = document.getElementById('submitBtn');
            const errDiv   = document.getElementById('error-msg');
            const errText  = document.getElementById('error-text');

            errDiv.style.display = 'none';

            if (!email || !password) {
                errText.textContent = 'Please enter both email and password.';
                errDiv.style.display = 'flex';
                return;
            }

            btn.textContent = 'Signing in...';
            btn.disabled = true;

            try {
                const res = await fetch('http://localhost:8080/Backend/resources/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });

                const data = await res.json();

                if (!res.ok) {
                    errText.textContent = data.error || 'Invalid email or password.';
                    errDiv.style.display = 'flex';
                    btn.textContent = 'Sign In';
                    btn.disabled = false;
                    return;
                }

                localStorage.setItem('token',   data.token);
                localStorage.setItem('role',    data.role);
                localStorage.setItem('name',    data.name);
                localStorage.setItem('staffId', data.staffId);
                localStorage.setItem('patientId', data.patientId);
                localStorage.setItem('email',   data.email);

                // Convert role to uppercase to avoid mismatch issues (e.g. 'Admin' vs 'ADMIN')
                const activeRole = (data.role || '').toUpperCase();

                if (activeRole === 'SYSTEM_ADMIN' || activeRole === 'ADMIN') {
                    window.location.href = '/Frontend/admin-dashboard.html';
                } else if (activeRole === 'RECEPTIONIST') {
                    window.location.href = '/Frontend/receptionist-dashboard.html';
                } else if (activeRole === 'DENTIST') {
                    window.location.href = '/Frontend/dentist-dashboard.html';
                } else if (activeRole === 'PATIENT') {
                    window.location.href = '/Frontend/patient-dashboard.html';
                } else {
                    window.location.href = '/Frontend/login.html';
                }

            } catch (err) {
                errText.textContent = 'Cannot connect to server. Ensure the backend is running.';
                errDiv.style.display = 'flex';
                btn.textContent = 'Sign In';
                btn.disabled = false;
            }
        });

        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
