<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
    <style>
        body { margin: 0; background: #f4f6fb; }
        .login-page {
            min-height: 100vh;
            display: flex;
        }
        .brand-panel {
            flex: 1.15;
            background: url('/Frontend/image/img.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            color: white;
            position: relative;
        }
        .brand-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(15,28,63,0.92) 0%, rgba(37,99,235,0.65) 100%);
        }
        .brand-content {
            position: relative;
            z-index: 1;
            max-width: 480px;
        }
        .brand-logo-icon {
            font-size: 3.2rem;
            margin-bottom: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 88px; height: 88px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 22px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }
        .brand-content h1 {
            font-size: 3.2rem;
            font-weight: 800;
            margin: 0 0 14px 0;
            line-height: 1.05;
            letter-spacing: -1px;
        }
        .brand-content p {
            font-size: 1.1rem;
            opacity: 0.92;
            line-height: 1.6;
            font-weight: 400;
        }
        .form-panel {
            flex: 1;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
        }
        .login-card h2 {
            font-size: 2rem;
            color: #0f172a;
            margin: 0 0 6px 0;
            font-weight: 800;
        }
        .login-card .sub {
            color: #64748b;
            margin: 0 0 32px 0;
            font-size: 1rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
            color: #334155;
            font-size: 0.88rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: #f8fafc;
            color: #0f172a;
        }
        .form-group input:focus {
            border-color: #2563eb;
            background: #ffffff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }
        .password-container {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            font-size: 1.15rem;
            padding: 4px;
        }
        .btn-login {
            width: 100%;
            padding: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 6px;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
        }
        .btn-login:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
        }
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            padding: 13px 16px;
            border-radius: 10px;
            margin-bottom: 22px;
            font-size: 0.9rem;
            border: 1px solid #fecaca;
            display: none;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }
        .login-foot {
            text-align: center;
            margin-top: 32px;
            font-size: 0.82rem;
            color: #94a3b8;
        }
        @media (max-width: 900px) {
            .login-page { flex-direction: column; }
            .brand-panel { flex: none; padding: 60px 20px; text-align: center; }
            .brand-content { margin: 0 auto; }
            .brand-logo-icon { width: 68px; height: 68px; font-size: 2.2rem; margin-bottom: 14px; }
            .brand-content h1 { font-size: 2.4rem; }
        }
    </style>
</head>
<body>
    <div class="login-page">
        <aside class="brand-panel">
            <div class="brand-content">
                <div class="brand-logo-icon">🦷</div>
                <h1>Sunrise<br>Dental Clinic</h1>
                <p>Your Smile, Our Care.<br>Modern dental management for a modern practice.</p>
            </div>
        </aside>

        <main class="form-panel">
            <div class="login-card">
                <h2>Welcome Back</h2>
                <p class="sub">Sign in to access your dashboard.</p>

                <div id="error-msg" class="error-msg" style="display: none;">
                    <span>⚠️</span> <span id="error-text"></span>
                </div>

                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="name@sunrisedental.lk" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-container">
                            <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
                            <button type="button" class="password-toggle" onclick="togglePassword()">👁️</button>
                        </div>
                    </div>

                    <button type="submit" class="btn-login" id="submitBtn">Sign In</button>
                </form>

                <p class="login-foot">© 2026 Sunrise Dental Clinic · Sri Lanka</p>
            </div>
        </main>
    </div>

    <script>
        (function() {
            const token = localStorage.getItem('token');
            const role  = localStorage.getItem('role');
            if (token && role) {
                const userRole = role.toUpperCase();
                if (userRole === 'SYSTEM_ADMIN' || userRole === 'ADMIN') window.location.href = '/Frontend/admin-dashboard.html';
                else if (userRole === 'RECEPTIONIST') window.location.href = '/Frontend/receptionist-dashboard.html';
                else if (userRole === 'DENTIST')      window.location.href = '/Frontend/dentist-dashboard.html';
                else if (userRole === 'PATIENT')      window.location.href = '/Frontend/login.html';
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn      = document.getElementById('submitBtn');
            const errDiv   = document.getElementById('error-msg');
            const errText  = document.getElementById('error-text');

            errDiv.style.display = 'none';

            if (!email || !password) {
                errText.textContent = 'Please enter both email and password.';
                errDiv.style.display = 'flex';
                return;
            }

            btn.textContent = 'Signing in...';
            btn.disabled = true;

            try {
                const res = await fetch('http://localhost:8080/Backend/resources/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });

                const data = await res.json();

                if (!res.ok) {
                    errText.textContent = data.error || 'Invalid email or password.';
                    errDiv.style.display = 'flex';
                    btn.textContent = 'Sign In';
                    btn.disabled = false;
                    return;
                }

                localStorage.setItem('token',   data.token);
                localStorage.setItem('role',    data.role);
                localStorage.setItem('name',    data.name);
                localStorage.setItem('staffId', data.staffId);
                localStorage.setItem('patientId', data.patientId);
                localStorage.setItem('email',   data.email);

                const activeRole = (data.role || '').toUpperCase();

                if (activeRole === 'SYSTEM_ADMIN' || activeRole === 'ADMIN') {
                    window.location.href = '/Frontend/admin-dashboard.html';
                } else if (activeRole === 'RECEPTIONIST') {
                    window.location.href = '/Frontend/receptionist-dashboard.html';
                } else if (activeRole === 'DENTIST') {
                    window.location.href = '/Frontend/dentist-dashboard.html';
                } else if (activeRole === 'PATIENT') {
                    showToast('Patient portal is not available. Please contact the clinic.', 'error');
                    setTimeout(() => window.location.href = '/Frontend/login.html', 2000);
                } else {
                    window.location.href = '/Frontend/login.html';
                }

            } catch (err) {
                errText.textContent = 'Cannot connect to server. Ensure the backend is running.';
                errDiv.style.display = 'flex';
                btn.textContent = 'Sign In';
                btn.disabled = false;
            }
        });

        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
