<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Patients – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
</head>
<body>
<div class="header">
    <h1>Sunrise Dental Clinic</h1>
    <div class="user-info" id="user-info"></div>
</div>
<div class="sticky-nav">
    <nav class="nav" id="main-nav"></nav>
</div>

<div class="container">
    <div id="toast-container"></div>

    <div class="page-header">
        <div>
            <h2>Patient Management</h2>
            <p>Search, view and manage patient records</p>
        </div>
        <a href="/Frontend/add-patient.html" class="btn btn-primary">➕ Add New Patient</a>
    </div>

    <div class="card card-stat">
        <div class="stat-icon">👥</div>
        <div class="stat-body">
            <div class="stat-value" id="totalPatients">0</div>
            <div class="stat-label">Total Patients</div>
        </div>
    </div>

    <div class="card">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by name, NIC or contact..." oninput="filterPatients()">
            <button class="btn btn-ghost" onclick="clearSearch()">Clear</button>
        </div>
        <p id="resultCount"></p>

        <div class="table-wrapper">
            <table class="table" id="patientTable">
                <thead>
                    <tr><th>ID</th><th>Name</th><th>NIC</th><th>Contact</th><th>Email</th><th>Actions</th></tr>
                </thead>
                <tbody><tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-muted);">Loading...</td></tbody>
            </table>
        </div>
    </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
    requireAuth();

    let allPatients = [];
    const role = localStorage.getItem('role');

    async function loadPatients() {
        try {
            allPatients = await apiGet('/patients');
            document.getElementById('totalPatients').textContent = allPatients.length;
            renderTable(allPatients);
        } catch (e) { showToast('Failed to load patients', 'error'); }
    }

    async function deletePatient(id, name) {
        if (!confirm('Are you sure you want to delete patient "' + name + '"?\n\nThis action cannot be undone.')) return;
        try {
            const res = await apiDelete('/patients/' + id);
            if (res.error) { showToast(res.error, 'error'); return; }
            showToast('Patient deleted ✅');
            loadPatients();
        } catch (e) { showToast('Failed to delete patient', 'error'); }
    }

    function renderTable(patients) {
        document.getElementById('resultCount').textContent =
            patients.length + ' patient' + (patients.length !== 1 ? 's' : '') + ' found';

        const tbody = document.querySelector('#patientTable tbody');
        if (!patients.length) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted);">No patients found</td></tr>';
            return;
        }
        tbody.innerHTML = patients.map(p => `
            <tr>
                <td><strong>${p.patientId}</strong></td>
                <td>${p.name}</td>
                <td>${p.nic}</td>
                <td>${p.contact}</td>
                <td>${p.email || '–'}</td>
                <td>
                    <a href="/Frontend/edit-patient.html?patient_id=${p.patientId}" class="btn btn-sm btn-warning">✏️ Edit</a>
                    <a href="/Frontend/patient-history.html?patient_id=${p.patientId}" class="btn btn-sm btn-ghost">📁 History</a>
                    <a href="/Frontend/register-appointment.html" class="btn btn-sm btn-primary"
                       onclick="localStorage.setItem('quickNic','${p.nic}')">📅 Book</a>
                    ${(role === 'ADMIN' || role === 'SYSTEM_ADMIN') ? `<button class="btn btn-sm btn-danger" onclick="deletePatient(${p.patientId}, '${p.name.replace(/'/g,"\\'")}')">🗑️ Delete</button>` : ''}
                </td>
            </tr>`).join('');
    }

    function filterPatients() {
        const q = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!q) { renderTable(allPatients); return; }
        const filtered = allPatients.filter(p =>
            p.name.toLowerCase().includes(q) ||
            (p.nic && p.nic.toLowerCase().includes(q)) ||
            (p.contact && p.contact.includes(q)) ||
            (p.email && p.email.toLowerCase().includes(q))
        );
        renderTable(filtered);
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        renderTable(allPatients);
    }

    loadPatients();
</script>
</body>
</html>
