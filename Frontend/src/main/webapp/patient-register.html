<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
</head>
<body>
<div class="header">
    <h1>Sunrise Dental Clinic</h1>
    <div class="user-info"><a href="/Frontend/login.html" style="color:#fff;text-decoration:none;">← Back to Login</a></div>
</div>
<div class="container" style="max-width:640px;">
    <div class="card">
        <h2>🦷 Patient Registration</h2>
        <p style="color:var(--text-secondary);margin-bottom:20px;">Create your patient account to book appointments online.</p>
        <div id="error-msg" class="error-msg" style="background:#fee2e2;color:#991b1b;padding:12px 16px;border-radius:10px;margin-bottom:18px;font-size:0.88rem;display:none;"></div>

        <form id="regForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>NIC</label>
                    <input type="text" id="nic" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Contact (07XXXXXXXX)</label>
                    <input type="text" id="contact" required pattern="0[0-9]{9}">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="">Select</option>
                        <option>Male</option><option>Female</option><option>Other</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="address">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm" required minlength="6">
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Create Account</button>
        </form>
    </div>
</div>

<script>
document.getElementById('regForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const err = document.getElementById('error-msg');
    err.style.display = 'none';
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;
    if (password !== confirm) { err.textContent = 'Passwords do not match.'; err.style.display='block'; return; }

    const payload = {
        name: document.getElementById('name').value.trim(),
        nic: document.getElementById('nic').value.trim(),
        email: document.getElementById('email').value.trim(),
        contact: document.getElementById('contact').value.trim(),
        date_of_birth: document.getElementById('dob').value,
        gender: document.getElementById('gender').value,
        address: document.getElementById('address').value.trim(),
        password: password
    };

    try {
        const res = await fetch('http://localhost:8080/Backend/resources/auth/patient/register', {
            method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.error || 'Registration failed.'; err.style.display='block'; return; }
        alert('Registration successful! You can now log in.');
        window.location.href = '/Frontend/login.html';
    } catch (e) {
        err.textContent = 'Cannot connect to server.'; err.style.display='block';
    }
});
</script>
</body>
</html>
