<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
    <style>
        .profile-hero {
            background: linear-gradient(135deg, #0f1c3f 0%, #1e3a8a 45%, #2563eb 100%);
            color: white;
            padding: 32px 28px;
            border-radius: var(--radius-lg);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: var(--card-shadow-lg);
        }
        .profile-avatar {
            width: 72px; height: 72px; border-radius: 50%;
            background: rgba(255,255,255,0.18);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.35);
        }
        .profile-avatar svg { width: 36px; height: 36px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .profile-hero-text h2 { font-size: 1.4rem; font-weight: 800; margin: 0 0 4px 0; }
        .profile-hero-text p { margin: 0; opacity: 0.85; font-size: 0.9rem; font-weight: 500; }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .detail-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: var(--card-shadow);
            transition: all var(--transition);
        }
        .detail-item:hover { box-shadow: var(--card-shadow-lg); }
        .detail-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 6px;
        }
        .detail-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            word-break: break-word;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }
        .section-title svg {
            width: 20px; height: 20px; stroke: currentColor; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        @media (max-width: 640px) {
            .profile-hero { flex-direction: column; text-align: center; }
            .detail-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="header">
    <h1>Sunrise Dental Clinic</h1>
    <div class="user-info" id="user-info"></div>
</div>
<div class="sticky-nav">
    <nav class="nav" id="main-nav"></nav>
</div>

<div class="container">
    <div id="toast-container"></div>

    <div class="page-header">
        <div>
            <h2>My Profile</h2>
            <p>View and manage your account details</p>
        </div>
    </div>

    <div id="loadError" class="alert alert-error" style="display:none;"></div>

    <!-- Profile Hero -->
    <div class="profile-hero" id="profileHero" style="display:none;">
        <div class="profile-avatar">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="profile-hero-text">
            <h2 id="heroName">Loading...</h2>
            <p id="heroRole">Loading...</p>
        </div>
    </div>

    <!-- View Mode -->
    <div id="viewMode">
        <div class="card" id="viewCard" style="display:none;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
                <div class="section-title" style="margin-bottom:0;">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Account Information
                </div>
                <button class="btn btn-primary" id="editProfileBtn">
                    <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-right:6px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    Edit Profile
                </button>
            </div>
            <div class="detail-grid" id="viewDetails"></div>
            <div style="margin-top:24px;padding-top:20px;border-top:1.5px solid var(--border);">
                <div class="section-title">
                    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    Security
                </div>
                <button class="btn btn-ghost" id="showChangePasswordBtn" style="border:none;padding-left:0;">
                    Change Password
                </button>
            </div>
        </div>
    </div>

    <!-- Edit Mode -->
    <div id="editMode" style="display:none;">
        <div class="card">
            <div class="section-title">
                <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                Edit Profile
            </div>
            <div id="editError" class="alert alert-error" style="display:none;"></div>
            <div id="editSuccess" class="alert alert-success" style="display:none;"></div>
            <form id="editProfileForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="editName" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address *</label>
                        <input type="email" id="editEmail" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Contact Number *</label>
                        <input type="text" id="editContact" maxlength="15" required>
                    </div>
                    <div class="form-group" id="editAddressGroup">
                        <label>Address</label>
                        <input type="text" id="editAddress">
                    </div>
                </div>
                <div class="form-row" id="editSpecializationGroup" style="display:none;">
                    <div class="form-group">
                        <label>Specialization</label>
                        <input type="text" id="editSpecialization">
                    </div>
                    <div class="form-group" id="editAvailableDaysGroup" style="display:none;">
                        <label>Available Days</label>
                        <input type="text" id="editAvailableDays" placeholder="e.g. Monday,Tuesday,Wednesday">
                    </div>
                </div>
                <div class="form-row" id="editShiftGroup" style="display:none;">
                    <div class="form-group">
                        <label>Shift Hours</label>
                        <input type="text" id="editShift" placeholder="e.g. 08:00 - 17:00">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="saveProfileBtn">Save Changes</button>
                    <button type="button" class="btn btn-ghost" id="cancelEditBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Change Password Section -->
    <div id="changePasswordSection" style="display:none;margin-top:24px;">
        <div class="card">
            <div class="section-title">
                <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Change Password
            </div>
            <div id="passwordError" class="alert alert-error" style="display:none;"></div>
            <div id="passwordSuccess" class="alert alert-success" style="display:none;"></div>
            <form id="changePasswordForm">
                <div class="form-group">
                    <label>Current Password *</label>
                    <input type="password" id="currentPassword" required placeholder="Enter your current password">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>New Password *</label>
                        <input type="password" id="newPassword" required placeholder="At least 6 characters" minlength="6">
                    </div>
                    <div class="form-group">
                        <label>Confirm New Password *</label>
                        <input type="password" id="confirmPassword" required placeholder="Re-enter new password" minlength="6">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="changePasswordBtn">Update Password</button>
                    <button type="button" class="btn btn-ghost" id="cancelPasswordBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
    requireAuth(['ADMIN', 'SYSTEM_ADMIN', 'RECEPTIONIST', 'DENTIST']);

    const token = localStorage.getItem('token');
    const role = localStorage.getItem('role');
    let profileData = null;
    let profileType = null;

    function getStatusBadge(status) {
        const cls = 'status-' + String(status).toLowerCase().replace(/[^a-z0-9]+/g, '-');
        return '<span class="status-badge ' + cls + '">' + status + '</span>';
    }

    async function loadProfile() {
        const errDiv = document.getElementById('loadError');
        try {
            const data = await apiGet('/auth/me');
            profileData = data;
            profileType = data.type;
            renderProfile(data);
        } catch (e) {
            errDiv.textContent = 'Failed to load profile. Please try again.';
            errDiv.style.display = 'flex';
        }
    }

    function renderProfile(data) {
        document.getElementById('profileHero').style.display = 'flex';
        document.getElementById('heroName').textContent = data.name || '-';
        document.getElementById('heroRole').textContent = (data.role || '').replace(/_/g, ' ') + (data.isActive !== false ? ' · Active' : ' · Inactive');

        const details = document.getElementById('viewDetails');
        const items = [];

        if (profileType === 'DENTIST') {
            items.push({ label: 'Full Name', value: data.name });
            items.push({ label: 'Email', value: data.email });
            items.push({ label: 'Contact Number', value: data.contact });
            items.push({ label: 'Specialization', value: data.specialization || '-' });
            items.push({ label: 'Available Days', value: data.availableDays || '-' });
            items.push({ label: 'Role', value: data.role });
            items.push({ label: 'Account Status', value: data.isActive !== false ? getStatusBadge('Active') : getStatusBadge('Inactive') });

            document.getElementById('editSpecializationGroup').style.display = 'flex';
            document.getElementById('editAvailableDaysGroup').style.display = 'flex';
            document.getElementById('editAddressGroup').style.display = 'none';
            document.getElementById('editShiftGroup').style.display = 'none';
        } else {
            items.push({ label: 'Full Name', value: data.name });
            items.push({ label: 'Email', value: data.email });
            items.push({ label: 'Contact Number', value: data.contact });
            items.push({ label: 'Address', value: data.address || '-' });
            items.push({ label: 'NIC', value: data.nic || '-' });
            items.push({ label: 'Role', value: data.role });
            items.push({ label: 'Shift Hours', value: data.shiftHours || '-' });
            items.push({ label: 'Account Status', value: data.isActive !== false ? getStatusBadge('Active') : getStatusBadge('Inactive') });

            document.getElementById('editAddressGroup').style.display = 'flex';
            document.getElementById('editShiftGroup').style.display = 'flex';
            document.getElementById('editSpecializationGroup').style.display = 'none';
            document.getElementById('editAvailableDaysGroup').style.display = 'none';
        }

        details.innerHTML = items.map(function(item) {
            return '<div class="detail-item"><div class="detail-label">' + item.label + '</div><div class="detail-value">' + item.value + '</div></div>';
        }).join('');

        document.getElementById('viewCard').style.display = 'block';
    }

    function showEditMode() {
        document.getElementById('viewMode').style.display = 'none';
        document.getElementById('changePasswordSection').style.display = 'none';
        document.getElementById('editMode').style.display = 'block';

        document.getElementById('editName').value = profileData.name || '';
        document.getElementById('editEmail').value = profileData.email || '';
        document.getElementById('editContact').value = profileData.contact || '';
        document.getElementById('editAddress').value = profileData.address || '';
        document.getElementById('editSpecialization').value = profileData.specialization || '';
        document.getElementById('editAvailableDays').value = profileData.availableDays || '';
        document.getElementById('editShift').value = profileData.shiftHours || '';

        document.getElementById('editError').style.display = 'none';
        document.getElementById('editSuccess').style.display = 'none';
    }

    function showViewMode() {
        document.getElementById('editMode').style.display = 'none';
        document.getElementById('changePasswordSection').style.display = 'none';
        document.getElementById('viewMode').style.display = 'block';
    }

    document.getElementById('editProfileBtn').addEventListener('click', showEditMode);
    document.getElementById('cancelEditBtn').addEventListener('click', showViewMode);

    document.getElementById('editProfileForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const errDiv = document.getElementById('editError');
        const okDiv = document.getElementById('editSuccess');
        errDiv.style.display = 'none';
        okDiv.style.display = 'none';

        const name = document.getElementById('editName').value.trim();
        const email = document.getElementById('editEmail').value.trim();
        const contact = document.getElementById('editContact').value.trim();

        if (!name || !email || !contact) {
            errDiv.textContent = 'Name, email, and contact are required.';
            errDiv.style.display = 'flex';
            return;
        }

        const btn = document.getElementById('saveProfileBtn');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        const data = {
            name: name,
            email: email,
            contact: contact
        };

        if (profileType === 'DENTIST') {
            data.specialization = document.getElementById('editSpecialization').value.trim();
            data.availableDays = document.getElementById('editAvailableDays').value.trim();
        } else {
            data.address = document.getElementById('editAddress').value.trim();
            data.shiftHours = document.getElementById('editShift').value.trim();
        }

        try {
            const res = await apiPut('/auth/me', data);
            if (res.error) {
                errDiv.textContent = res.error;
                errDiv.style.display = 'flex';
            } else {
                okDiv.textContent = res.message || 'Profile updated successfully!';
                okDiv.style.display = 'flex';
                showToast('Profile updated');
                profileData = { ...profileData, ...data };
                renderProfile(profileData);
                showViewMode();
            }
        } catch (e) {
            errDiv.textContent = 'Failed to update profile.';
            errDiv.style.display = 'flex';
        }
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-right:6px;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 17 8"/></svg> Save Changes';
    });

    document.getElementById('showChangePasswordBtn').addEventListener('click', function() {
        document.getElementById('viewMode').style.display = 'none';
        document.getElementById('editMode').style.display = 'none';
        document.getElementById('changePasswordSection').style.display = 'block';
        document.getElementById('passwordError').style.display = 'none';
        document.getElementById('passwordSuccess').style.display = 'none';
        document.getElementById('changePasswordForm').reset();
    });

    document.getElementById('cancelPasswordBtn').addEventListener('click', showViewMode);

    document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const errDiv = document.getElementById('passwordError');
        const okDiv = document.getElementById('passwordSuccess');
        errDiv.style.display = 'none';
        okDiv.style.display = 'none';

        const current = document.getElementById('currentPassword').value;
        const newPass = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (!current || !newPass || !confirm) {
            errDiv.textContent = 'All fields are required.';
            errDiv.style.display = 'flex';
            return;
        }
        if (newPass !== confirm) {
            errDiv.textContent = 'New password and confirm password do not match.';
            errDiv.style.display = 'flex';
            return;
        }
        if (newPass.length < 6) {
            errDiv.textContent = 'New password must be at least 6 characters.';
            errDiv.style.display = 'flex';
            return;
        }

        const btn = document.getElementById('changePasswordBtn');
        btn.disabled = true;
        btn.textContent = 'Updating...';

        try {
            const res = await apiPut('/auth/me/password', {
                currentPassword: current,
                newPassword: newPass,
                confirmPassword: confirm
            });
            if (res.error) {
                errDiv.textContent = res.error;
                errDiv.style.display = 'flex';
            } else {
                okDiv.textContent = res.message || 'Password changed successfully!';
                okDiv.style.display = 'flex';
                showToast('Password updated');
                document.getElementById('changePasswordForm').reset();
                setTimeout(showViewMode, 1500);
            }
        } catch (e) {
            errDiv.textContent = 'Failed to change password.';
            errDiv.style.display = 'flex';
        }
        btn.disabled = false;
        btn.textContent = 'Update Password';
    });

    loadProfile();
</script>
</body>
</html>
