<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
</head>
<body>
<div class="header">
    <h1>Sunrise Dental Clinic</h1>
    <div class="user-info" id="user-info"></div>
</div>
<nav class="nav" id="main-nav"></nav>

<div class="container">
    <div id="toast-container"></div>
    <div class="page-header">
        <div><h2>⚙️ Settings</h2><p>Clinic profile and account</p></div>
    </div>

    <div class="card">
        <h2>🏥 Clinic Information</h2>
        <div class="receipt-row"><span class="r-label">Clinic Name</span><span class="r-value">Sunrise Dental Clinic</span></div>
        <div class="receipt-row"><span class="r-label">Address</span><span class="r-value">Colombo 07, Sri Lanka</span></div>
        <div class="receipt-row"><span class="r-label">Contact</span><span class="r-value">077 000 0001</span></div>
        <div class="receipt-row"><span class="r-label">Email</span><span class="r-value">admin@sunrisedental.com</span></div>
        <div class="receipt-row"><span class="r-label">Appointment Duration</span><span class="r-value">30 minutes</span></div>
        <div class="receipt-row"><span class="r-label">Currency</span><span class="r-value">LKR (Rs.)</span></div>
    </div>

    <div class="card">
        <h2>🔒 Change Password</h2>
        <form id="pwForm">
            <div class="form-group"><label>New Password</label><input type="password" id="password" required minlength="6"></div>
            <button type="submit" class="btn btn-warning">Update Password</button>
        </form>
    </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
    requireAuth(['ADMIN']);
    const staffId = localStorage.getItem('staffId');

    document.getElementById('pwForm').addEventListener('submit', async function(e){
        e.preventDefault();
        const password = document.getElementById('password').value;
        try {
            await apiPut('/staff/' + staffId, { password: password });
            showToast('Password updated successfully', 'success');
            this.reset();
        } catch(err){ showToast('Failed to update password', 'error'); }
    });
</script>
</body>
</html>
