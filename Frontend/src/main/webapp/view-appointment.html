<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
    <style>
        .status-select {
            border: 1.5px solid var(--border-strong);
            background: var(--surface);
            color: var(--text-primary);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-family: inherit;
        }
        .btn-disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>Sunrise Dental Clinic</h1>
    <div class="user-info" id="user-info"></div>
</div>
<div class="sticky-nav">
    <nav class="nav" id="main-nav"></nav>
</div>

<div class="container">
    <div id="toast-container"></div>

    <div class="page-header">
        <div>
            <h2>Appointment Management</h2>
            <p>Search, view and manage appointments</p>
        </div>
        <a href="/Frontend/register-appointment.html" class="btn btn-primary" id="newApptBtn">New Appointment</a>
    </div>

    <!-- Search -->
    <div class="card">
        <h2>Search Appointment</h2>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search appointment by number or patient name..."
                   onkeydown="if(event.key==='Enter') searchAppointment();">
            <button class="btn btn-primary" onclick="searchAppointment()">Search</button>
            <button class="btn btn-ghost" onclick="resetSearch()">Show All</button>
        </div>
        <div id="searchResult" class="alert" style="display:none;"></div>
    </div>

    <!-- Appointment Detail Card -->
    <div id="detailCard" class="card" style="display:none;">
        <div style="display:flex;justify-content:center;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;">
            <h2>Appointment Details</h2>
            <div id="actionButtons"></div>
        </div>
        <div id="apptDetails"></div>
    </div>

    <!-- All Appointments Table -->
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;">
            <h2>Appointments List</h2>
            <div class="form-row" style="margin-bottom:0;gap:10px;">
                <div class="form-group" style="margin-bottom:0;">
                    <select id="statusFilter" onchange="filterTable()">
                        <option value="">All Statuses</option>
                        <option value="Pending">Pending</option>
                        <option value="Completed">Completed</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <input type="date" id="dateFilter" onchange="filterTable()">
                </div>
            </div>
        </div>
        <div class="table-wrapper">
            <table class="table" id="apptTable">
                <thead>
                    <tr><th>Appt No</th><th>Patient</th><th>Dentist</th><th>Treatment</th><th>Date</th><th>Time</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody><tr><td colspan="8" class="empty-state">Loading...</td></tbody>
            </table>
        </div>
    </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
    requireAuth();

    let allAppointments = [];
    let allDentists = [];
    let allPatients = [];
    let dentistMap = {};
    let patientMap = {};
    let currentApptId = null;
    const role = localStorage.getItem('role');

    if (role === 'DENTIST') {
        document.getElementById('newApptBtn').style.display = 'none';
    }

    async function loadAll() {
        try {
            const [rawAppointments, dentists, patients] = await Promise.all([
                apiGet('/appointments'),
                apiGet('/dentists'),
                apiGet('/patients')
            ]);

            allDentists = dentists;
            allPatients = patients;

            allDentists.forEach(d => dentistMap[d.dentistId] = d.name);
            allPatients.forEach(p => patientMap[p.patientId] = p.name);

            if (role === 'DENTIST') {
                const email = (localStorage.getItem('email') || '').toLowerCase();
                const me = allDentists.find(d => (d.email || '').toLowerCase() === email);
                if (me) {
                    allAppointments = rawAppointments.filter(a => a.dentistId === me.dentistId);
                } else {
                    allAppointments = [];
                }
            } else {
                allAppointments = rawAppointments;
            }

            allAppointments.sort((a, b) => {
                const dateA = a.appointmentDate || '';
                const dateB = b.appointmentDate || '';
                if (dateA !== dateB) return dateA.localeCompare(dateB);
                return (a.appointmentTime || '').localeCompare(b.appointmentTime || '');
            });

            renderTable(allAppointments);
        } catch (e) { showToast('Failed to load appointments', 'error'); }
    }

    function renderTable(appointments) {
        const tbody = document.querySelector('#apptTable tbody');
        if (!appointments.length) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No appointments found</td></tr>';
            return;
        }
        const canBill = role === 'ADMIN' || role === 'RECEPTIONIST' || role === 'SYSTEM_ADMIN';
        tbody.innerHTML = appointments.map(a => {
            const billDisabled = a.status !== 'Completed';
            const billClass = billDisabled ? 'btn-disabled' : '';
            const billTitle = a.status === 'Cancelled' ? 'Cancelled appointments cannot be billed.' : 'Bill can only be generated after the appointment is completed.';
            return '<tr>' +
                '<td><strong>' + a.appointmentNo + '</strong></td>' +
                '<td>' + (patientMap[a.patientId] || 'Patient #' + a.patientId) + '</td>' +
                '<td>' + (dentistMap[a.dentistId] || 'Dentist #' + a.dentistId) + '</td>' +
                '<td>' + a.treatmentType + '</td>' +
                '<td>' + a.appointmentDate + '</td>' +
                '<td>' + (a.appointmentTime ? a.appointmentTime.substring(0,5) : '') + '</td>' +
                '<td>' + getStatusBadge(a.status) + '</td>' +
                '<td style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">' +
                    '<button class="btn btn-sm btn-ghost" onclick="showDetail(' + a.appointmentId + ')">View</button>' +
                    (role !== 'DENTIST' ? '<button class="btn btn-sm btn-warning" onclick="window.location.href=\'/Frontend/edit-appointment.html?appt_id=' + a.appointmentId + '\'">Edit</button>' : '') +
                    (role === 'ADMIN' || role === 'SYSTEM_ADMIN' ? '<button class="btn btn-sm btn-danger" onclick="deleteAppointment(' + a.appointmentId + ', \'' + a.appointmentNo + '\')">Delete</button>' : '') +
                    (canBill ? '<a class="btn btn-sm btn-success ' + billClass + '" href="/Frontend/billing.html?appt_id=' + a.appointmentId + '" title="' + billTitle + '">Bill</a>' : '') +
                '</td>' +
            '</tr>';
        }).join('');
    }

    function getStatusBadge(status) {
        const cls = 'status-' + String(status).toLowerCase().replace(/[^a-z0-9]+/g, '-');
        return '<span class="status-badge ' + cls + '">' + status + '</span>';
    }

    function filterTable() {
        const status = document.getElementById('statusFilter').value;
        const date = document.getElementById('dateFilter').value;
        let filtered = allAppointments;
        if (status) filtered = filtered.filter(a => a.status === status);
        if (date) filtered = filtered.filter(a => a.appointmentDate === date);
        renderTable(filtered);
    }

    function searchAppointment() {
        const q = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!q) { resetSearch(); return; }

        const res = document.getElementById('searchResult');
        let matched = allAppointments.filter(a =>
            (a.appointmentNo || '').toLowerCase().includes(q) ||
            (patientMap[a.patientId] || '').toLowerCase().includes(q)
        );

        if (matched.length > 0) {
            res.style.display = 'none';
            renderTable(matched);
            showDetail(matched[0].appointmentId);
            document.getElementById('detailCard').scrollIntoView({ behavior: 'smooth' });
        } else {
            res.className = 'alert alert-error';
            res.style.display = 'flex';
            res.textContent = 'No appointments found matching "' + q + '".';
            renderTable([]);
        }
    }

    function resetSearch() {
        document.getElementById('searchInput').value = '';
        document.getElementById('searchResult').style.display = 'none';
        filterTable();
    }

    async function showDetail(apptId) {
        try {
            const a = allAppointments.find(appt => appt.appointmentId === apptId);
            if (!a) return;

            const dentistName = dentistMap[a.dentistId] || 'Dentist #' + a.dentistId;
            const patientName = patientMap[a.patientId] || 'Patient #' + a.patientId;

            document.getElementById('apptDetails').innerHTML =
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">' +
                    '<div><p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Appointment No</p>' +
                         '<p style="font-size:1.1rem;font-weight:700;color:var(--primary);">' + a.appointmentNo + '</p></div>' +
                    '<div><p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Status</p>' +
                         '<p>' + getStatusBadge(a.status) + '</p></div>' +
                    '<div><p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Patient</p>' +
                         '<p style="font-weight:600;">' + patientName + '</p></div>' +
                    '<div><p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Dentist</p>' +
                         '<p style="font-weight:600;">' + dentistName + '</p></div>' +
                    '<div><p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Treatment</p>' +
                         '<p>' + a.treatmentType + '</p></div>' +
                    '<div><p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Contact</p>' +
                         '<p>' + (a.contact || '–') + '</p></div>' +
                    '<div><p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Date</p>' +
                         '<p>' + a.appointmentDate + '</p></div>' +
                    '<div><p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Time</p>' +
                         '<p>' + (a.appointmentTime ? a.appointmentTime.substring(0,5) : '–') + '</p></div>' +
                    '<div style="grid-column:1/-1;"><p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Notes</p>' +
                         '<p>' + (a.notes || '–') + '</p></div>' +
                '</div>';

            const btns = document.getElementById('actionButtons');
            btns.innerHTML = '';

            if (role === 'ADMIN' || role === 'RECEPTIONIST' || role === 'SYSTEM_ADMIN') {
                btns.innerHTML += '<button class="btn btn-sm btn-warning" onclick="window.location.href=\'/Frontend/edit-appointment.html?appt_id=' + a.appointmentId + '\'" style="margin-right:4px;">Edit</button>';
                btns.innerHTML += '<button class="btn btn-sm btn-danger" onclick="deleteAppointment(' + a.appointmentId + ', \'' + a.appointmentNo + '\')" style="margin-right:4px;">Delete</button>';
            }

            currentApptId = a.appointmentId;
            document.getElementById('detailCard').style.display = 'block';
        } catch (e) { showToast('Failed to load appointment details', 'error'); }
    }

    async function deleteAppointment(id, appointmentNo) {
        if (!confirm('Are you sure you want to delete appointment "' + appointmentNo + '"?\n\nThis action cannot be undone.')) return;
        try {
            const res = await apiDelete('/appointments/' + id);
            if (res.error) { showToast(res.error, 'error'); return; }
            showToast('Appointment deleted ✅');

            document.getElementById('detailCard').style.display = 'none';
            await loadAll();
        } catch (e) { showToast('Failed to delete appointment', 'error'); }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const preNo = urlParams.get('no');
    if (preNo) {
        document.getElementById('searchInput').value = preNo;
    }

    loadAll().then(() => {
        if (preNo) searchAppointment();
    });
</script>
</body>
</html>
