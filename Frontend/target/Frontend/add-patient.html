<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
</head>
<body>
<div class="header">
    <h1>Sunrise Dental Clinic</h1>
    <div class="user-info" id="user-info"></div>
</div>
<div class="sticky-nav">
    <nav class="nav" id="main-nav"></nav>
</div>

<div class="container" style="max-width:720px;">
    <div id="toast-container"></div>

    <div class="page-header">
        <div><h2>Add New Patient</h2><p>Register a new patient in the system</p></div>
        <a href="/Frontend/manage-patients.html" class="btn btn-ghost btn-sm">← Back to Patients</a>
    </div>

    <div class="card">
        <h2>👤 Patient Information</h2>
        <div id="errorMsg" class="alert alert-error" style="display:none;"></div>
        <div id="successMsg" class="alert alert-success" style="display:none;"></div>

        <form id="patientForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="name" placeholder="Patient full name" required>
                </div>
                <div class="form-group">
                    <label>NIC Number *</label>
                    <!-- NIC length limited to 12 characters -->
                    <input type="text" id="nic" placeholder="e.g. 901234567V or 199012345678" maxlength="12" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Contact Number (10 digits) *</label>
                    <input type="text" id="contact" placeholder="07XXXXXXXX" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="patient@email.com">
                </div>
            </div>
            
            <div class="form-group">
                <label>Home Address</label>
                <input type="text" id="address" placeholder="Full home address">
            </div>
            
            <!-- Blood Group removed, only Known Allergies kept -->
            <div class="form-group">
                <label>Known Allergies</label>
                <input type="text" id="allergies" placeholder="e.g. Penicillin, Latex">
            </div>

            <div id="successCard" style="display:none;" class="alert alert-success">
                <h3 style="margin:0 0 8px;color:var(--success);">✅ Patient Registered Successfully!</h3>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:0.875rem;margin-bottom:14px;">
                    <div><strong>Patient Name:</strong> <span id="okName"></span></div>
                    <div><strong>Patient ID:</strong> <span id="okId"></span></div>
                    <div><strong>NIC:</strong> <span id="okNic"></span></div>
                    <div><strong>Contact:</strong> <span id="okContact"></span></div>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <a id="okViewLink" href="/Frontend/manage-patients.html" class="btn btn-sm btn-primary">View Patient</a>
                    <button type="button" class="btn btn-sm btn-ghost" onclick="resetForm()">Add Another Patient</button>
                    <button type="button" class="btn btn-sm btn-ghost" onclick="document.getElementById('successCard').style.display='none'">Close</button>
                </div>
            </div>

            <div style="display:flex;gap:12px;margin-top:8px;" id="formActions">
                <button type="submit" class="btn btn-primary btn-lg" id="saveBtn">💾 Save Patient</button>
                <a href="/Frontend/manage-patients.html" class="btn btn-ghost btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
    requireAuth(['RECEPTIONIST', 'ADMIN', 'SYSTEM_ADMIN']);

    document.getElementById('patientForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const errDiv = document.getElementById('errorMsg');
        const okDiv  = document.getElementById('successCard');
        errDiv.style.display = 'none';
        okDiv.style.display  = 'none';

        const contact = document.getElementById('contact').value.trim();
        const nic     = document.getElementById('nic').value.trim();
        const name    = document.getElementById('name').value.trim();

        if (!name)    { errDiv.textContent = 'Patient name is required.'; errDiv.style.display = 'flex'; return; }
        if (!nic)     { errDiv.textContent = 'NIC is required.'; errDiv.style.display = 'flex'; return; }
        
        // NIC Validation (Sri Lankan Format check - 10 characters or 12 digits)
        const nicRegex = /^([0-9]{9}[vVxX]|[0-9]{12})$/;
        if (!nicRegex.test(nic)) {
            errDiv.textContent = 'Please enter a valid 12-digit or 10-character NIC.';
            errDiv.style.display = 'flex'; return;
        }

        if (!/^0\d{9}$/.test(contact)) {
            errDiv.textContent = 'Contact must be 10 digits starting with 0 (e.g. 0712345678).';
            errDiv.style.display = 'flex'; return;
        }

        const btn = document.getElementById('saveBtn');
        btn.disabled = true; btn.textContent = 'Saving...';

        const data = {
            name,
            nic,
            contact,
            dateOfBirth: document.getElementById('dob').value || null,
            gender:      document.getElementById('gender').value,
            address:     document.getElementById('address').value,
            email:       document.getElementById('email').value,
            allergies:   document.getElementById('allergies').value
        };

        try {
            const res = await apiPost('/patients', data);
            if (res.error) {
                errDiv.textContent = res.error;
                errDiv.style.display = 'flex';
            } else {
                document.getElementById('okName').textContent = name;
                document.getElementById('okId').textContent = res.patientId;
                document.getElementById('okNic').textContent = nic;
                document.getElementById('okContact').textContent = contact;
                document.getElementById('okViewLink').href = '/Frontend/manage-patients.html';
                okDiv.style.display = 'flex';
                document.getElementById('formActions').style.display = 'none';
            }
        } catch (e) {
            errDiv.textContent = 'Failed to save patient. Check backend is running.';
            errDiv.style.display = 'flex';
        }

        btn.disabled = false; btn.textContent = '💾 Save Patient';
    });

    function resetForm() {
        document.getElementById('patientForm').reset();
        document.getElementById('successCard').style.display = 'none';
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('formActions').style.display = 'flex';
    }
</script>
</body>
</html>
