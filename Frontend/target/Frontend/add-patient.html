<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
</head>
<body>
<div class="header">
    <h1>Sunrise Dental Clinic</h1>
    <div class="user-info" id="user-info"></div>
</div>
<nav class="nav" id="main-nav"></nav>

<div class="container" style="max-width:720px;">
    <div id="toast-container"></div>

    <div class="page-header">
        <div><h2>Add New Patient</h2><p>Register a new patient in the system</p></div>
        <a href="/Frontend/manage-patients.html" class="btn btn-ghost btn-sm">← Back to Patients</a>
    </div>

    <div class="card">
        <h2>👤 Patient Information</h2>
        <div id="errorMsg" class="alert alert-error" style="display:none;"></div>
        <div id="successMsg" class="alert alert-success" style="display:none;"></div>

        <form id="patientForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="name" placeholder="Patient full name" required>
                </div>
                <div class="form-group">
                    <label>NIC Number *</label>
                    <input type="text" id="nic" placeholder="e.g. 901234567V or 199012345678" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Contact Number (10 digits) *</label>
                    <input type="text" id="contact" placeholder="07XXXXXXXX" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="patient@email.com">
                </div>
            </div>
            <div class="form-group">
                <label>Home Address</label>
                <input type="text" id="address" placeholder="Full home address">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Blood Group</label>
                    <select id="bloodGroup">
                        <option value="">Unknown</option>
                        <option>A+</option><option>A-</option>
                        <option>B+</option><option>B-</option>
                        <option>AB+</option><option>AB-</option>
                        <option>O+</option><option>O-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Known Allergies</label>
                    <input type="text" id="allergies" placeholder="e.g. Penicillin, Latex">
                </div>
            </div>

            <div style="display:flex;gap:12px;margin-top:8px;">
                <button type="submit" class="btn btn-primary btn-lg" id="saveBtn">💾 Save Patient</button>
                <a href="/Frontend/manage-patients.html" class="btn btn-ghost btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
    requireAuth(['RECEPTIONIST', 'ADMIN']);

    document.getElementById('patientForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const errDiv = document.getElementById('errorMsg');
        const okDiv  = document.getElementById('successMsg');
        errDiv.style.display = 'none';
        okDiv.style.display  = 'none';

        const contact = document.getElementById('contact').value.trim();
        const nic     = document.getElementById('nic').value.trim();
        const name    = document.getElementById('name').value.trim();

        if (!name)    { errDiv.textContent = 'Patient name is required.'; errDiv.style.display = 'flex'; return; }
        if (!nic)     { errDiv.textContent = 'NIC is required.'; errDiv.style.display = 'flex'; return; }
        if (!/^0\d{9}$/.test(contact)) {
            errDiv.textContent = 'Contact must be 10 digits starting with 0 (e.g. 0712345678).';
            errDiv.style.display = 'flex'; return;
        }

        const btn = document.getElementById('saveBtn');
        btn.disabled = true; btn.textContent = 'Saving...';

        const data = {
            name,
            nic,
            contact,
            dateOfBirth: document.getElementById('dob').value || null,
            gender:      document.getElementById('gender').value,
            address:     document.getElementById('address').value,
            email:       document.getElementById('email').value,
            bloodGroup:  document.getElementById('bloodGroup').value || null,
            allergies:   document.getElementById('allergies').value
        };

        try {
            const res = await apiPost('/patients', data);
            if (res.error) {
                errDiv.textContent = res.error;
                errDiv.style.display = 'flex';
            } else {
                okDiv.innerHTML = `✅ Patient <strong>${name}</strong> registered successfully! (ID: ${res.patientId})
                    <a href="/Frontend/manage-patients.html" style="margin-left:10px;">← Back to Patients</a>`;
                okDiv.style.display = 'flex';
                document.getElementById('patientForm').reset();
            }
        } catch (e) {
            errDiv.textContent = 'Failed to save patient. Check backend is running.';
            errDiv.style.display = 'flex';
        }

        btn.disabled = false; btn.textContent = '💾 Save Patient';
    });
</script>
</body>
</html>
