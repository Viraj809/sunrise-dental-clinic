<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
</head>
<body>
    <div class="header">
        <h1>Edit Patient</h1>
    </div>
    <nav class="nav" id="main-nav"></nav>
    <div class="container" style="max-width:600px;">
        <div id="toast-container"></div>
        <div class="card">
            <form id="patientForm">
                <input type="hidden" id="patientId">
                <div class="form-group"><label>Name *</label><input type="text" id="name" required></div>
                <div class="form-group"><label>Date of Birth</label><input type="date" id="dob"></div>
                <div class="form-group"><label>Gender</label><select id="gender"><option>Male</option><option>Female</option><option>Other</option></select></div>
                <div class="form-group"><label>Address</label><input type="text" id="address"></div>
                <div class="form-group"><label>Contact (10 digits, starts with 0) *</label><input type="text" id="contact" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="email"></div>
                <div class="form-group"><label>Blood Group</label><input type="text" id="bloodGroup"></div>
                <div class="form-group"><label>Allergies</label><textarea id="allergies" rows="2"></textarea></div>
                <button type="submit" class="btn btn-primary">Update Patient</button>
                <a href="/Frontend/api/patients" class="btn" style="background:var(--gray-200); margin-left:10px;">Cancel</a>
            </form>
        </div>
    </div>
    <script src="/Frontend/js/app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const patientId = urlParams.get('patient_id');
        async function loadPatient() {
            if (!patientId) return;
            try {
                const p = await apiGet('/patients/' + patientId);
                document.getElementById('patientId').value = p.patient_id;
                document.getElementById('name').value = p.name;
                document.getElementById('dob').value = p.date_of_birth;
                document.getElementById('gender').value = p.gender;
                document.getElementById('address').value = p.address;
                document.getElementById('contact').value = p.contact;
                document.getElementById('email').value = p.email;
                document.getElementById('bloodGroup').value = p.blood_group;
                document.getElementById('allergies').value = p.allergies;
            } catch (e) { showToast('Failed to load patient', 'error'); }
        }
        loadPatient();

        document.getElementById('patientForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('patientId').value;
            const data = {
                name: document.getElementById('name').value,
                date_of_birth: document.getElementById('dob').value,
                gender: document.getElementById('gender').value,
                address: document.getElementById('address').value,
                contact: document.getElementById('contact').value,
                email: document.getElementById('email').value,
                blood_group: document.getElementById('bloodGroup').value,
                allergies: document.getElementById('allergies').value
            };
            try {
                const res = await apiPost('/patients/' + id, data);
                if (!res.error) {
                    showToast('Patient updated successfully');
                    setTimeout(() => window.location.href = '/Frontend/api/patients', 1000);
                } else {
                    showToast(res.error, 'error');
                }
            } catch (e) { showToast('Failed to update patient', 'error'); }
        });
    </script>
</body>
</html>
