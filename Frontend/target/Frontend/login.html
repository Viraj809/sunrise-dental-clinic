<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
</head>
<body>
    <div class="header">
        <h1>Sunrise Dental Clinic</h1>
    </div>
    <div class="container" style="max-width:400px; margin-top:80px;">
        <div class="card">
            <h2 style="text-align:center; margin-bottom:20px;">System Login</h2>
            <div id="toast-container"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
            </form>
            <div id="error-msg" style="color:var(--danger); margin-top:12px; text-align:center;"></div>
            <div style="margin-top:20px; font-size:0.85rem; color:var(--gray-600);">
                <p><strong>Demo Accounts:</strong></p>
                <p>Admin: admin@sunrisedental.com / admin123</p>
                <p>Receptionist: reception@sunrisedental.com / reception123</p>
                <p>Dentist: perera@sunrisedental.com / dentist123</p>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');
            errorDiv.textContent = '';

            try {
                const res = await fetch('/Backend/resources/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('name', data.name);
                    localStorage.setItem('staffId', data.staffId);
                    window.location.href = '/Frontend/dashboard';
                } else {
                    errorDiv.textContent = data.error || 'Login failed';
                }
            } catch (err) {
                errorDiv.textContent = 'Cannot connect to server. Ensure Backend is running.';
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error')) {
            document.getElementById('error-msg').textContent = urlParams.get('error');
        }
    </script>
</body>
</html>
