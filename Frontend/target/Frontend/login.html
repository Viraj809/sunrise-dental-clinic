<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 50%, #1e3a8a 100%);
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            padding: 48px;
            width: 100%;
            max-width: 420px;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo h1 {
            font-size: 1.75rem;
            color: #1f2937;
            margin-bottom: 8px;
        }
        .login-logo p {
            color: #6b7280;
            font-size: 0.95rem;
        }
        .login-icon {
            width: 64px;
            height: 64px;
            background: #dbeafe;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 28px;
        }
        .form-group label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        .form-group input {
            padding: 12px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #2563eb;
            outline: none;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-login:hover {
            background: #1d4ed8;
        }
        .error-msg {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }
        .demo-accounts {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }
        .demo-accounts p {
            color: #6b7280;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }
        .demo-accounts strong {
            color: #374151;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <div class="login-icon">&#127968;</div>
                <h1>Sunrise Dental Clinic</h1>
                <p>Management System</p>
            </div>
            <div id="error-msg" class="error-msg"></div>
            <form id="loginForm" method="POST" action="/Frontend/login">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login">Sign In</button>
            </form>
            <div class="demo-accounts">
                <p><strong>Demo Accounts:</strong></p>
                <p>Admin: admin@sunrisedental.com / admin123</p>
                <p>Receptionist: reception@sunrisedental.com / reception123</p>
                <p>Dentist: perera@sunrisedental.com / dentist123</p>
            </div>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const errDiv = document.getElementById('error-msg');
            errDiv.textContent = decodeURIComponent(error);
            errDiv.style.display = 'block';
        }
    </script>
</body>
</html>
