<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Dentists – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
    <style>
        .day-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 2px solid var(--border, #e2e8f0);
            background: #fff;
            color: var(--text-primary, #0f172a);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .day-btn.active {
            background: var(--primary, #2563eb);
            color: #fff;
            border-color: var(--primary, #2563eb);
        }
    </style>
</head>
<body>
<div class="header">
    <h1>Sunrise Dental Clinic</h1>
    <div class="user-info" id="user-info"></div>
</div>
<nav class="nav" id="main-nav"></nav>

<div class="container">
    <div id="toast-container"></div>

    <div class="page-header">
        <div><h2>Dentist Management</h2><p>View, add and manage dentists</p></div>
        <button class="btn btn-primary" onclick="openModal()">➕ Add Dentist</button>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;" id="dentistGrid">
        <div style="text-align:center;padding:40px;color:var(--text-muted);grid-column:1/-1;">Loading...</div>
    </div>
</div>

<!-- Add/Edit Dentist Modal -->
<div id="dentistModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <h3 id="modalTitle">➕ Add Dentist</h3>
        <div id="modalError" class="alert alert-error" style="display:none;"></div>
        <div id="regResult" class="alert alert-success" style="display:none;"></div>
        <div id="dentistFormFields">
            <div class="form-row">
                <div class="form-group"><label>Full Name *</label><input type="text" id="m-name" placeholder="Dr. Perera"></div>
                <div class="form-group"><label>NIC *</label><input type="text" id="m-nic" placeholder="e.g. 904567891V"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Specialization *</label>
                    <select id="m-spec">
                        <option value="">Select Specialization</option>
                        <option value="General Dentistry">General Dentistry</option>
                        <option value="Orthodontics">Orthodontics</option>
                        <option value="Endodontics">Endodontics</option>
                        <option value="Periodontics">Periodontics</option>
                        <option value="Prosthodontics">Prosthodontics</option>
                        <option value="Oral Surgery">Oral Surgery</option>
                        <option value="Pediatric Dentistry">Pediatric Dentistry</option>
                        <option value="Cosmetic Dentistry">Cosmetic Dentistry</option>
                        <option value="Implant Dentistry">Implant Dentistry</option>
                        <option value="Oral & Maxillofacial Surgery">Oral & Maxillofacial Surgery</option>
                    </select>
                </div>
                <div class="form-group"><label>Contact</label><input type="text" id="m-contact" placeholder="07XXXXXXXX" maxlength="10"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Email * (login)</label><input type="email" id="m-email" placeholder="dr@clinic.com"></div>
                <div class="form-group"><label>Password (login)</label><input type="text" id="m-password" placeholder="dentist123"></div>
            </div>
            <div class="form-group"><label>Available Days</label>
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
                    <label style="display:flex;align-items:center;gap:6px;font-size:0.875rem;cursor:pointer;">
                        <input type="checkbox" id="m-allDays" checked onchange="toggleAllDays()"> All Days
                    </label>
                </div>
                <div id="m-daySelector" style="display:flex;gap:6px;flex-wrap:wrap;">
                    <button type="button" class="day-btn active" data-day="Monday"    onclick="toggleDay(this)">Mon</button>
                    <button type="button" class="day-btn active" data-day="Tuesday"   onclick="toggleDay(this)">Tue</button>
                    <button type="button" class="day-btn active" data-day="Wednesday" onclick="toggleDay(this)">Wed</button>
                    <button type="button" class="day-btn active" data-day="Thursday"  onclick="toggleDay(this)">Thu</button>
                    <button type="button" class="day-btn active" data-day="Friday"    onclick="toggleDay(this)">Fri</button>
                    <button type="button" class="day-btn active" data-day="Saturday"  onclick="toggleDay(this)">Sat</button>
                    <button type="button" class="day-btn active" data-day="Sunday"    onclick="toggleDay(this)">Sun</button>
                </div>
                <input type="hidden" id="m-days">
            </div>
            <p style="font-size:0.8rem;color:var(--text-muted);margin:-6px 0 14px;">
                A staff login is created so this dentist can sign in. Leave password blank to use the default <strong>dentist123</strong>.
            </p>
        </div>
        <input type="hidden" id="m-dentistId">
        <div class="modal-actions" id="dentistModalActions">
            <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveDentist()" id="saveDentistBtn">💾 Save Dentist</button>
        </div>
    </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
    requireAuth(['ADMIN', 'SYSTEM_ADMIN']);

    let editingId = null;

    function toggleDay(btn) {
        btn.classList.toggle('active');
        syncDays();
    }

    function toggleAllDays() {
        const checked = document.getElementById('m-allDays').checked;
        document.querySelectorAll('#m-daySelector .day-btn').forEach(b => {
            if (checked) b.classList.add('active');
            else b.classList.remove('active');
        });
        syncDays();
    }

    function syncDays() {
        const checked = document.querySelectorAll('#m-daySelector .day-btn.active');
        document.getElementById('m-days').value = Array.from(checked).map(b => b.dataset.day).join(',');
    }

    async function loadDentists() {
        try {
            const dentists = await apiGet('/dentists');
            const grid = document.getElementById('dentistGrid');
            if (!dentists.length) {
                grid.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);grid-column:1/-1;">No dentists found</div>';
                return;
            }
            grid.innerHTML = dentists.map(d => {
                const days = (d.availableDays || '').split(',').map(s => s.trim()).filter(Boolean).join(', ') || '–';
                return `<div class="card" style="margin-bottom:0;">
                    <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">
                        <div style="width:48px;height:48px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;flex-shrink:0;">
                            ${(d.name || 'D').charAt(0)}
                        </div>
                        <div style="min-width:0;">
                            <div style="font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">🦷 ${d.name}</div>
                            <div style="font-size:0.8rem;color:var(--primary);font-weight:500;">${d.specialization || 'General Dentistry'}</div>
                        </div>
                        <span class="badge ${d.active ? 'badge-paid' : 'badge-cancelled'}" style="flex-shrink:0;">${d.active ? 'Active' : 'Inactive'}</span>
                    </div>
                    <div style="font-size:0.85rem;color:var(--text-secondary);display:flex;flex-direction:column;gap:5px;padding:10px 12px;background:var(--surface-alt);border-radius:var(--radius);">
                        <div style="display:flex;justify-content:space-between;"><span>🆔 ID</span><strong>${d.dentistId}</strong></div>
                        <div style="display:flex;justify-content:space-between;"><span>📞 Contact</span><strong>${d.contact || '–'}</strong></div>
                        <div style="display:flex;justify-content:space-between;"><span>✉️ Email</span><strong style="font-size:0.8rem;">${d.email || '–'}</strong></div>
                        <div style="display:flex;justify-content:space-between;align-items:flex-start;"><span>📅 Available</span><strong style="text-align:right;max-width:60%;">${days}</strong></div>
                    </div>
                    <div style="display:flex;gap:8px;margin-top:14px;">
                        <button class="btn btn-sm btn-warning" onclick="openEditModal(${d.dentistId})">✏️ Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="confirmDeleteDentist(${d.dentistId}, '${d.name.replace(/'/g,"\\'")}')">🗑️ Delete</button>
                    </div>
                </div>`;
            }).join('');
        } catch (e) { showToast('Failed to load dentists', 'error'); }
    }

    async function confirmDeleteDentist(id, name) {
        if (!confirm('Are you sure you want to delete dentist "' + name + '"?\n\nThis action cannot be undone. Existing appointments must be cancelled or reassigned first.')) return;
        try {
            const res = await apiDelete('/dentists/' + id);
            if (res.error) { showToast(res.error, 'error'); return; }
            showToast('Dentist deleted ✅');
            loadDentists();
        } catch (e) { showToast('Failed to delete dentist', 'error'); }
    }

    function openModal() {
        editingId = null;
        document.getElementById('modalTitle').textContent = '➕ Add Dentist';
        document.getElementById('m-dentistId').value = '';
        ['m-name','m-nic','m-contact','m-email','m-password'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('m-spec').value = '';
        document.getElementById('modalError').style.display = 'none';
        document.getElementById('regResult').style.display = 'none';
        document.getElementById('dentistFormFields').style.display = 'block';
        document.getElementById('dentistModalActions').style.display = 'flex';
        document.getElementById('dentistModal').style.display = 'flex';
        document.getElementById('m-allDays').checked = true;
        toggleAllDays();
    }

    async function openEditModal(dentistId) {
        try {
            const d = await apiGet('/dentists/' + dentistId);
            editingId = dentistId;
            document.getElementById('modalTitle').textContent = '✏️ Edit Dentist';
            document.getElementById('m-dentistId').value      = d.dentistId;
            document.getElementById('m-name').value           = d.name || '';
            document.getElementById('m-spec').value           = d.specialization || '';
            document.getElementById('m-nic').value            = d.nic || '';
            document.getElementById('m-contact').value        = d.contact || '';
            document.getElementById('m-email').value          = d.email || '';
            document.getElementById('modalError').style.display = 'none';
            const days = (d.availableDays || '').split(',').map(s => s.trim()).filter(Boolean);
            const allDays = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
            if (days.length === 7 && allDays.every(day => days.includes(day))) {
                document.getElementById('m-allDays').checked = true;
            } else {
                document.getElementById('m-allDays').checked = false;
            }
            document.querySelectorAll('#m-daySelector .day-btn').forEach(b => {
                const day = b.dataset.day;
                if (days.includes(day)) b.classList.add('active');
                else b.classList.remove('active');
            });
            syncDays();
            document.getElementById('dentistModal').style.display = 'flex';
        } catch (e) { showToast('Failed to load dentist', 'error'); }
    }

    function closeModal() {
        document.getElementById('dentistModal').style.display = 'none';
    }

    async function saveDentist() {
        const errDiv = document.getElementById('modalError');
        errDiv.style.display = 'none';
        document.getElementById('regResult').style.display = 'none';
        document.getElementById('dentistModalActions').style.display = 'flex';
        document.getElementById('dentistFormFields').style.display = 'block';

        const name = document.getElementById('m-name').value.trim();
        if (!name) { errDiv.textContent = 'Dentist name is required.'; errDiv.style.display = 'flex'; return; }
        const spec = document.getElementById('m-spec').value;
        if (!spec) { errDiv.textContent = 'Please select a specialization.'; errDiv.style.display = 'flex'; return; }
        const nic = document.getElementById('m-nic').value.trim();
        if (!nic) { errDiv.textContent = 'NIC is required.'; errDiv.style.display = 'flex'; return; }

        const btn = document.getElementById('saveDentistBtn');
        btn.disabled = true; btn.textContent = 'Saving...';

        try {
            let res;
            if (editingId) {
                const data = {
                    name,
                    specialization: spec,
                    nic,
                    contact:        document.getElementById('m-contact').value,
                    email:          document.getElementById('m-email').value,
                    availableDays:  document.getElementById('m-days').value,
                    active:         true
                };
                res = await apiPut('/dentists/' + editingId, data);
                if (res.error) {
                    errDiv.textContent = res.error; errDiv.style.display = 'flex';
                } else {
                    showToast('Dentist updated successfully ✅');
                    closeModal(); loadDentists();
                }
            } else {
                const data = {
                    name,
                    specialization: spec,
                    nic,
                    contact:        document.getElementById('m-contact').value,
                    email:          document.getElementById('m-email').value,
                    password:       document.getElementById('m-password').value,
                    available_days: document.getElementById('m-days').value,
                    active:         true
                };
                res = await apiPost('/dentists/register', data);
                if (res.error) {
                    errDiv.textContent = res.error; errDiv.style.display = 'flex';
                } else if (res.password) {
                    document.getElementById('dentistFormFields').style.display = 'none';
                    document.getElementById('dentistModalActions').style.display = 'none';
                    const rr = document.getElementById('regResult');
                    rr.innerHTML = `<h3 style="margin:0 0 8px;color:var(--success);">✅ Dentist Added Successfully!</h3>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:0.875rem;margin-bottom:10px;">
                            <div><strong>Name:</strong> ${name}</div>
                            <div><strong>ID:</strong> ${res.dentistId || '–'}</div>
                            <div><strong>Specialization:</strong> ${spec}</div>
                        </div>
                        <div style="font-size:0.85rem;background:var(--surface-alt);padding:10px;border-radius:var(--radius);">
                            <strong>Login Email:</strong> ${res.email || ''}<br>
                            <strong>Password:</strong> ${res.password}<br>
                            <span style="font-size:0.78rem;color:var(--text-muted);">Share these details with the dentist so they can sign in.</span>
                        </div>
                        <button class="btn btn-sm btn-ghost" onclick="closeModal();loadDentists();" style="margin-top:10px;">Close</button>`;
                    rr.style.display = 'flex';
                    showToast('Dentist added with login ✅');
                    loadDentists();
                }
            }
        } catch (e) { errDiv.textContent = 'Failed to save dentist.'; errDiv.style.display = 'flex'; }
        btn.disabled = false; btn.textContent = '💾 Save Dentist';
    }

    loadDentists();
</script>
</body>
</html>
