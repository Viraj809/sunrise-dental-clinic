<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Staff - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
</head>
<body>
    <div class="header">
        <h1>Manage Staff</h1>
    </div>
    <nav class="nav" id="main-nav"></nav>
    <div class="container">
        <div id="toast-container"></div>
        <div class="card">
            <h2>Staff List</h2>
            <table class="table" id="staffTable">
                <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Contact</th><th>Role</th><th>Status</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="/Frontend/js/app.js"></script>
    <script>
        async function loadStaff() {
            try {
                const staff = await apiGet('/staff');
                const tbody = document.querySelector('#staffTable tbody');
                tbody.innerHTML = '';
                staff.forEach(s => {
                    tbody.innerHTML += '<tr><td>' + s.staff_id + '</td><td>' + s.name + '</td><td>' + s.email + '</td><td>' + s.contact + '</td><td>' + s.role + '</td><td>' + (s.is_active ? 'Active' : 'Inactive') + '</td></tr>';
                });
            } catch (e) { showToast('Failed to load staff', 'error'); }
        }
        loadStaff();
    </script>
</body>
</html>
