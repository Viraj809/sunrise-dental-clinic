<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
</head>
<body>
<div class="header">
    <h1>Sunrise Dental Clinic</h1>
    <div class="user-info" id="user-info"></div>
</div>
<nav class="nav" id="main-nav"></nav>

<div class="container">
    <div id="toast-container"></div>
    <div class="page-header">
        <div><h2>My Appointments</h2><p>Book and manage your dental visits</p></div>
    </div>

    <div class="card">
        <h2>➕ Book New Appointment</h2>
        <div class="error-msg" id="book-error" style="display:none;background:#fee2e2;color:#991b1b;padding:12px 16px;border-radius:10px;margin-bottom:18px;font-size:0.88rem;"></div>
        <form id="bookForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Dentist</label>
                    <select id="dentistId" required></select>
                </div>
                <div class="form-group">
                    <label>Treatment</label>
                    <select id="treatmentType" required></select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="appointmentDate" required>
                </div>
                <div class="form-group">
                    <label>Time</label>
                    <input type="time" id="appointmentTime" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Appointment Type</label>
                    <select id="appointmentType">
                        <option>Consultation</option>
                        <option>Follow-up</option>
                        <option>Emergency</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="text" id="contact" required pattern="0[0-9]{9}">
                </div>
            </div>
            <div class="form-group">
                <label>Notes</label>
                <textarea id="notes" placeholder="Anything we should know?"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Book Appointment</button>
        </form>
    </div>

    <div class="card">
        <h2>📋 My Appointment History</h2>
        <div class="table-wrapper">
            <table class="table" id="apptTable">
                <thead><tr><th>No</th><th>Treatment</th><th>Type</th><th>Date</th><th>Time</th><th>Status</th><th>Action</th></tr></thead>
                <tbody><tr><td colspan="7" class="empty-state" style="padding:30px;text-align:center;color:var(--text-muted);">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
    requireAuth(['PATIENT']);
    const patientId = localStorage.getItem('patientId');

    async function loadSelectors() {
        const [dentists, treatments] = await Promise.all([apiGet('/dentists'), apiGet('/treatments')]);
        document.getElementById('dentistId').innerHTML =
            '<option value="">Select dentist</option>' + dentists.map(d => `<option value="${d.dentistId}">${d.name} – ${d.specialization||''}</option>`).join('');
        document.getElementById('treatmentType').innerHTML =
            '<option value="">Select treatment</option>' + treatments.map(t => `<option value="${t.treatmentCode}">${t.treatmentName}</option>`).join('');
    }

    async function loadAppointments() {
        const appts = await apiGet('/appointments/patient/' + patientId);
        const tbody = document.querySelector('#apptTable tbody');
        if (appts.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted);">No appointments yet</td></tr>';
            return;
        }
        tbody.innerHTML = appts.map(a => {
            const canCancel = !['Completed','Cancelled'].includes(a.status);
            return `<tr>
                <td><strong>${a.appointmentNo}</strong></td>
                <td>${a.treatmentType}</td>
                <td>${a.appointmentType || 'Consultation'}</td>
                <td>${a.appointmentDate}</td>
                <td>${a.appointmentTime}</td>
                <td>${getStatusBadge(a.status)}</td>
                <td>${canCancel ? `<button class="btn btn-danger btn-sm" onclick="cancelAppt(${a.appointmentId})">Cancel</button>` : '—'}</td>
            </tr>`;
        }).join('');
    }

    async function cancelAppt(id) {
        if (!confirm('Are you sure you want to cancel this appointment?')) return;
        try {
            await apiPut('/appointments/' + id + '/status', { status: 'Cancelled' });
            showToast('Appointment cancelled', 'success');
            loadAppointments();
        } catch (e) { showToast('Failed to cancel', 'error'); }
    }

    document.getElementById('bookForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const err = document.getElementById('book-error');
        err.style.display = 'none';
        const payload = {
            patientId: parseInt(patientId),
            dentistId: parseInt(document.getElementById('dentistId').value),
            treatmentType: document.getElementById('treatmentType').value,
            appointmentDate: document.getElementById('appointmentDate').value,
            appointmentTime: document.getElementById('appointmentTime').value,
            appointmentType: document.getElementById('appointmentType').value,
            contact: document.getElementById('contact').value,
            notes: document.getElementById('notes').value
        };
        if (!payload.dentistId || !payload.treatmentType || !payload.appointmentDate || !payload.appointmentTime) {
            err.textContent = 'Please fill in all required fields.'; err.style.display='block'; return;
        }
        try {
            const res = await apiPost('/appointments', payload);
            if (res.error) { err.textContent = res.error; err.style.display='block'; return; }
            showToast('Appointment booked successfully. Reference: ' + res.appointmentNo, 'success');
            this.reset();
            loadAppointments();
        } catch (e) { err.textContent = 'Failed to book appointment.'; err.style.display='block'; }
    });

    (async function(){ await loadSelectors(); await loadAppointments(); })();
</script>
</body>
</html>
