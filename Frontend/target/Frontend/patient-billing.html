<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bills – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
</head>
<body>
<div class="header">
    <h1>Sunrise Dental Clinic</h1>
    <div class="user-info" id="user-info"></div>
</div>
<nav class="nav" id="main-nav"></nav>

<div class="container">
    <div id="toast-container"></div>
    <div class="page-header">
        <div><h2>My Bills</h2><p>View and print your receipts</p></div>
        <button class="btn btn-ghost no-print" onclick="window.print()">🖨️ Print</button>
    </div>

    <div id="listView">
        <div class="card">
            <h2>🧾 Bill History</h2>
            <div class="table-wrapper">
                <table class="table" id="billTable">
                    <thead><tr><th>Bill #</th><th>Appointment</th><th>Total (LKR)</th><th>Payment</th><th>Date</th><th>Action</th></tr></thead>
                    <tbody><tr><td colspan="6" class="empty-state" style="padding:30px;text-align:center;color:var(--text-muted);">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="receiptView" style="display:none;">
        <div class="card">
            <div class="receipt" id="receipt"></div>
        </div>
        <div style="text-align:center;margin-top:16px;" class="no-print">
            <a class="btn btn-ghost" href="/Frontend/patient-billing.html">← Back to list</a>
        </div>
    </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
    requireAuth(['PATIENT']);
    const patientId = localStorage.getItem('patientId');
    const params = new URLSearchParams(window.location.search);
    const apptId = params.get('appointment');

    if (apptId) { showReceipt(apptId); } else { showList(); }

    async function showList() {
        const appts = await apiGet('/appointments/patient/' + patientId);
        const rows = await Promise.all(appts.map(async a => {
            try {
                const b = await apiGet('/bills/appointment/' + a.appointmentId);
                return `<tr>
                    <td>#${b.billId}</td><td>${a.appointmentNo}</td>
                    <td>${(b.totalAmount||0).toLocaleString('en-LK',{minimumFractionDigits:2})}</td>
                    <td>${getStatusBadge(b.paymentStatus)}</td>
                    <td>${b.issuedAt ? b.issuedAt.split('T')[0] : '-'}</td>
                    <td><a class="btn btn-ghost btn-sm" href="/Frontend/patient-billing.html?appointment=${a.appointmentId}">View</a></td>
                </tr>`;
            } catch (e) { return ''; }
        }));
        const f = rows.filter(r=>r);
        document.querySelector('#billTable tbody').innerHTML = f.length ? f.join('')
            : '<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--text-muted);">No bills yet</td></tr>';
    }

    async function showReceipt(appointmentId) {
        document.getElementById('listView').style.display = 'none';
        document.getElementById('receiptView').style.display = 'block';
        const r = await apiGet('/bills/appointment/' + appointmentId + '/receipt');
        document.getElementById('receipt').innerHTML = `
            <div class="receipt-header">
                <h2>Sunrise Dental Clinic</h2>
                <p>Official Receipt</p>
            </div>
            <div class="receipt-row"><span class="r-label">Receipt #</span><span class="r-value">#${r.billId}</span></div>
            <div class="receipt-row"><span class="r-label">Appointment</span><span class="r-value">${r.appointmentNo||'-'}</span></div>
            <div class="receipt-row"><span class="r-label">Patient</span><span class="r-value">${r.patientName||''}</span></div>
            <div class="receipt-row"><span class="r-label">Dentist</span><span class="r-value">${r.dentistName||''}</span></div>
            <div class="receipt-row"><span class="r-label">Treatment</span><span class="r-value">${r.treatmentName||''}</span></div>
            <div class="receipt-row"><span class="r-label">Date</span><span class="r-value">${r.appointmentDate||''} ${r.appointmentTime||''}</span></div>
            <hr>
            <div class="receipt-row"><span class="r-label">Consultation Fee</span><span class="r-value">${(r.consultationFee||0).toLocaleString('en-LK',{minimumFractionDigits:2})}</span></div>
            <div class="receipt-row"><span class="r-label">Treatment Fee</span><span class="r-value">${(r.treatmentFee||0).toLocaleString('en-LK',{minimumFractionDigits:2})}</span></div>
            <div class="receipt-row"><span class="r-label">Discount</span><span class="r-value">${(r.discount||0).toLocaleString('en-LK',{minimumFractionDigits:2})}</span></div>
            <div class="receipt-row"><span class="r-label">Tax</span><span class="r-value">${(r.tax||0).toLocaleString('en-LK',{minimumFractionDigits:2})}</span></div>
            <div class="receipt-total"><span>Total</span><span>LKR ${(r.totalAmount||0).toLocaleString('en-LK',{minimumFractionDigits:2})}</span></div>
            <div class="receipt-row"><span class="r-label">Payment Status</span><span class="r-value">${r.paymentStatus||''}</span></div>
            <div class="receipt-row"><span class="r-label">Method</span><span class="r-value">${r.paymentMethod||''}</span></div>
        `;
    }
</script>
</body>
</html>
