<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
</head>
<body>
<div class="header">
    <h1>Sunrise Dental Clinic</h1>
    <div class="user-info" id="user-info"></div>
</div>
<nav class="nav" id="main-nav"></nav>

<div class="container">
    <div id="toast-container"></div>
    <div class="page-header">
        <div><h2>My Profile</h2><p>Update your personal details and password</p></div>
    </div>

    <div class="card">
        <h2>👤 Personal Information</h2>
        <div id="form-error" style="display:none;background:#fee2e2;color:#991b1b;padding:12px 16px;border-radius:10px;margin-bottom:18px;font-size:0.88rem;"></div>
        <form id="profileForm">
            <div class="form-row">
                <div class="form-group"><label>Full Name</label><input type="text" id="name" required></div>
                <div class="form-group"><label>NIC</label><input type="text" id="nic" disabled></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
                <div class="form-group"><label>Contact</label><input type="text" id="contact" required pattern="0[0-9]{9}"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Date of Birth</label><input type="date" id="dateOfBirth"></div>
                <div class="form-group"><label>Gender</label>
                    <select id="gender"><option>Male</option><option>Female</option><option>Other</option><option></option></select>
                </div>
            </div>
            <div class="form-group"><label>Address</label><input type="text" id="address"></div>
            <div class="form-group"><label>Blood Group</label><input type="text" id="bloodGroup"></div>
            <div class="form-group"><label>Allergies</label><input type="text" id="allergies"></div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
    </div>

    <div class="card">
        <h2>🔒 Change Password</h2>
        <form id="pwForm">
            <div class="form-row">
                <div class="form-group"><label>Current Password</label><input type="password" id="currentPassword" required></div>
                <div class="form-group"><label>New Password</label><input type="password" id="newPassword" required minlength="6"></div>
            </div>
            <button type="submit" class="btn btn-warning">Update Password</button>
        </form>
    </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
    requireAuth(['PATIENT']);
    const patientId = localStorage.getItem('patientId');

    (async function(){
        const p = await apiGet('/patients/me');
        document.getElementById('name').value = p.name || '';
        document.getElementById('nic').value = p.nic || '';
        document.getElementById('email').value = p.email || '';
        document.getElementById('contact').value = p.contact || '';
        document.getElementById('dateOfBirth').value = p.dateOfBirth || '';
        document.getElementById('gender').value = p.gender || '';
        document.getElementById('address').value = p.address || '';
        document.getElementById('bloodGroup').value = p.bloodGroup || '';
        document.getElementById('allergies').value = p.allergies || '';
    })();

    document.getElementById('profileForm').addEventListener('submit', async function(e){
        e.preventDefault();
        const err = document.getElementById('form-error'); err.style.display='none';
        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            contact: document.getElementById('contact').value,
            dateOfBirth: document.getElementById('dateOfBirth').value,
            gender: document.getElementById('gender').value,
            address: document.getElementById('address').value,
            bloodGroup: document.getElementById('bloodGroup').value,
            allergies: document.getElementById('allergies').value
        };
        try {
            await apiPut('/patients/me', payload);
            showToast('Profile updated', 'success');
        } catch(e){ err.textContent='Failed to update profile.'; err.style.display='block'; }
    });

    document.getElementById('pwForm').addEventListener('submit', async function(e){
        e.preventDefault();
        const payload = {
            currentPassword: document.getElementById('currentPassword').value,
            newPassword: document.getElementById('newPassword').value
        };
        try {
            await apiPut('/patients/me/password', payload);
            showToast('Password changed', 'success');
            this.reset();
        } catch(e){ showToast('Current password may be incorrect', 'error'); }
    });
</script>
</body>
</html>
