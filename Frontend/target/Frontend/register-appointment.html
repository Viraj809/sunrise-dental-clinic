<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Appointment – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
    <style>
        .autocomplete-wrapper { position: relative; }
        .autocomplete-dropdown {
            display: none;
            position: absolute;
            z-index: 50;
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            max-height: 220px;
            overflow-y: auto;
            width: 100%;
            box-shadow: var(--card-shadow-lg);
            top: calc(100% + 4px);
            left: 0;
        }
        .autocomplete-dropdown.active { display: block; }
        .autocomplete-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background var(--transition);
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover { background: var(--surface-alt); }
        .autocomplete-item .ac-name { font-weight: 600; font-size: 0.9rem; }
        .autocomplete-item .ac-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    </style>
</head>
<body>
<div class="header">
    <h1>Sunrise Dental Clinic</h1>
    <div class="user-info" id="user-info"></div>
</div>
<div class="sticky-nav">
    <nav class="nav" id="main-nav"></nav>
</div>

<div class="container">
    <div id="toast-container"></div>

    <div class="page-header">
        <div>
            <h2>Register New Appointment</h2>
            <p>Fill in patient and appointment details below</p>
        </div>
        <a href="/Frontend/view-appointment.html" class="btn btn-ghost">← Back to Appointments</a>
    </div>

    <!-- Patient Information -->
    <div class="card">
        <h2>Patient Information</h2>
        <div class="form-group">
            <label>Search Patient by Name</label>
            <div class="autocomplete-wrapper">
                <input type="text" id="patientSearch" placeholder="Type patient name..." autocomplete="off">
                <div id="patientAutocomplete" class="autocomplete-dropdown"></div>
            </div>
        </div>
        <div id="patientResult" class="alert" style="display:none;"></div>

        <div id="selectedPatientCard" class="alert alert-success" style="display:none;">
            <div>
                <strong>Selected Patient:</strong> <span id="selectedPatientName"></span><br>
                <span style="font-size:0.8rem;">NIC: <span id="selectedPatientNic"></span> | Contact: <span id="selectedPatientContact"></span></span>
            </div>
            <button class="btn btn-sm btn-ghost" onclick="clearPatientSelection()">Clear</button>
        </div>

        <div id="newPatientFields" style="display:none;">
            <div class="alert alert-info">Patient not found. Please enter new patient details below.</div>
            <div class="form-row">
                <div class="form-group"><label>Full Name *</label><input type="text" id="newPatientName" placeholder="Patient full name" required></div>
                <div class="form-group"><label>NIC *</label><input type="text" id="newPatientNic" placeholder="e.g. 901234567V" required></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Date of Birth</label><input type="date" id="newPatientDob"></div>
                <div class="form-group"><label>Gender</label>
                    <select id="newPatientGender"><option>Male</option><option>Female</option><option>Other</option></select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Contact (10 digits) *</label><input type="text" id="newPatientContact" placeholder="07XXXXXXXX" maxlength="10" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="newPatientEmail" placeholder="patient@email.com"></div>
            </div>
            <div class="form-group"><label>Address</label><input type="text" id="newPatientAddress" placeholder="Home address"></div>
            <div class="form-row">
                <div class="form-group"><label>Known Allergies</label><input type="text" id="newPatientAllergies" placeholder="e.g. Penicillin"></div>
            </div>
        </div>
    </div>

    <!-- Appointment Details -->
    <div class="card">
        <h2>Appointment Details</h2>
        <div id="error-msg" class="alert alert-error" style="display:none;"></div>
        <form id="appointmentForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Treatment Type *</label>
                    <select id="treatmentType" required onchange="previewPrice()">
                        <option value="">— Select Treatment —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Dentist *</label>
                    <select id="dentistId" required>
                        <option value="">— Select Dentist —</option>
                    </select>
                </div>
            </div>

            <div id="pricePreview" class="alert alert-info" style="display:none;"></div>

            <div class="form-row">
                <div class="form-group">
                    <label>Appointment Date *</label>
                    <input type="date" id="appointmentDate" required>
                </div>
                <div class="form-group">
                    <label>Appointment Time (08:00–18:00) *</label>
                    <input type="time" id="appointmentTime" required min="08:00" max="18:00">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Contact Number *</label>
                    <input type="text" id="contact" required placeholder="07XXXXXXXX" maxlength="10">
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <input type="text" id="notes" placeholder="Optional notes">
                </div>
            </div>

            <div style="display:flex;gap:12px;margin-top:8px;">
                <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">Register Appointment</button>
                <a href="/Frontend/view-appointment.html" class="btn btn-ghost btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
    requireAuth(['RECEPTIONIST', 'ADMIN', 'SYSTEM_ADMIN']);

    let selectedPatientId = null;
    let treatmentsList = [];

    document.getElementById('appointmentDate').min = new Date().toISOString().split('T')[0];

    async function loadDropdowns() {
        try {
            const [dentists, treatments] = await Promise.all([
                apiGet('/dentists'),
                apiGet('/treatments')
            ]);
            treatmentsList = treatments;

            const dSelect = document.getElementById('dentistId');
            dentists.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.dentistId;
                opt.textContent = d.name + (d.specialization ? ' – ' + d.specialization : '');
                dSelect.appendChild(opt);
            });

            const tSelect = document.getElementById('treatmentType');
            treatments.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.treatmentCode;
                opt.textContent = t.treatmentName + ' (LKR ' + t.basePrice.toLocaleString() + ')';
                tSelect.appendChild(opt);
            });
        } catch (e) { showToast('Failed to load options', 'error'); }
    }

    function previewPrice() {
        const code = document.getElementById('treatmentType').value;
        const t = treatmentsList.find(x => x.treatmentCode === code);
        const div = document.getElementById('pricePreview');
        if (t) {
            div.style.display = 'flex';
            div.innerHTML = '💰 Estimated: Consultation <strong>LKR ' + t.consultationFee.toLocaleString() + '</strong> + Treatment <strong>LKR ' + t.basePrice.toLocaleString() + '</strong> + 5% Tax';
        } else {
            div.style.display = 'none';
        }
    }

    async function searchPatient() {
        const nic = document.getElementById('searchNic').value.trim();
        if (!nic) { showToast('Please enter a NIC number', 'error'); return; }
        const res = document.getElementById('patientResult');
        try {
            const p = await apiGet('/patients/nic/' + encodeURIComponent(nic));
            selectedPatientId = p.patientId;
            document.getElementById('newPatientFields').style.display = 'none';
            res.className = 'alert alert-success';
            res.style.display = 'flex';
            res.innerHTML = '✅ Patient found: <strong style="margin-left:6px;">' + p.name + '</strong>&nbsp;(ID: ' + p.patientId + ', ' + p.contact + ')';
            document.getElementById('contact').value = p.contact || '';
        } catch (e) {
            selectedPatientId = null;
            res.className = 'alert alert-warning';
            res.style.display = 'flex';
            res.innerHTML = '⚠️ Patient not found. Please enter new patient details below.';
            document.getElementById('newPatientFields').style.display = 'block';
        }
    }

    let autocompleteTimer = null;
    document.getElementById('patientSearch').addEventListener('input', function() {
        const q = this.value.trim();
        const box = document.getElementById('patientAutocomplete');
        if (q.length < 2) { box.style.display = 'none'; return; }
        clearTimeout(autocompleteTimer);
        autocompleteTimer = setTimeout(async () => {
            try {
                const list = await apiGet('/patients/search/' + encodeURIComponent(q));
                if (!list.length) { box.style.display = 'none'; return; }
                box.innerHTML = list.map(p =>
                    '<div class="autocomplete-item" onclick="selectPatient(' + p.patientId + ', \'' + p.name.replace(/'/g,"\\'") + '\', \'' + (p.nic || '').replace(/'/g,"\\'") + '\', \'' + (p.contact || '').replace(/'/g,"\\'") + '\')">' +
                        '<div class="ac-name">' + p.name + '</div>' +
                        '<div class="ac-meta">NIC: ' + (p.nic || '–') + ' | Contact: ' + (p.contact || '–') + '</div>' +
                    '</div>'
                ).join('');
                box.style.display = 'block';
            } catch (e) { box.style.display = 'none'; }
        }, 200);
    });

    document.addEventListener('click', function(e) {
        const box = document.getElementById('patientAutocomplete');
        const input = document.getElementById('patientSearch');
        if (box && !box.contains(e.target) && e.target !== input) box.style.display = 'none';
    });

    function selectPatient(id, name, nic, contact) {
        selectedPatientId = id;
        document.getElementById('patientSearch').value = name;
        document.getElementById('patientAutocomplete').style.display = 'none';
        document.getElementById('newPatientFields').style.display = 'none';
        document.getElementById('patientResult').style.display = 'none';
        document.getElementById('selectedPatientCard').style.display = 'flex';
        document.getElementById('selectedPatientName').textContent = name;
        document.getElementById('selectedPatientNic').textContent = nic || '–';
        document.getElementById('selectedPatientContact').textContent = contact || '–';
        document.getElementById('contact').value = contact || '';
    }

    function clearPatientSelection() {
        selectedPatientId = null;
        document.getElementById('patientSearch').value = '';
        document.getElementById('selectedPatientCard').style.display = 'none';
        document.getElementById('newPatientFields').style.display = 'none';
    }

    document.getElementById('appointmentForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const errorDiv = document.getElementById('error-msg');
        errorDiv.style.display = 'none';
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Registering...';

        let patientId = selectedPatientId;

        if (patientId == null) {
            const name    = document.getElementById('newPatientName').value.trim();
            const nic     = document.getElementById('newPatientNic').value.trim();
            const contact = document.getElementById('newPatientContact').value.trim();
            if (!name || !nic || !contact) {
                errorDiv.textContent = 'Patient Name, NIC and Contact are required for new patients.';
                errorDiv.style.display = 'flex';
                btn.disabled = false; btn.textContent = 'Register Appointment';
                return;
            }
            if (!/^0\d{9}$/.test(contact)) {
                errorDiv.textContent = 'Contact number must be 10 digits starting with 0.';
                errorDiv.style.display = 'flex';
                btn.disabled = false; btn.textContent = 'Register Appointment';
                return;
            }
            try {
                const np = {
                    name,
                    nic,
                    contact,
                    dateOfBirth: document.getElementById('newPatientDob').value || null,
                    gender:      document.getElementById('newPatientGender').value,
                    address:     document.getElementById('newPatientAddress').value,
                    email:       document.getElementById('newPatientEmail').value,
                    allergies:   document.getElementById('newPatientAllergies').value
                };
                const created = await apiPost('/patients', np);
                if (created.error) throw new Error(created.error);
                patientId = created.patientId;
                showToast('New patient registered: ' + name);
            } catch (err) {
                errorDiv.textContent = 'Failed to register patient: ' + (err.message || 'Unknown error');
                errorDiv.style.display = 'flex';
                btn.disabled = false; btn.textContent = 'Register Appointment';
                return;
            }
        }

        const appointmentTime = document.getElementById('appointmentTime').value;
        const contact = document.getElementById('contact').value.trim();
        if (!/^0\d{9}$/.test(contact)) {
            errorDiv.textContent = 'Contact number must be 10 digits starting with 0.';
            errorDiv.style.display = 'flex';
            btn.disabled = false; btn.textContent = 'Register Appointment';
            return;
        }

        const data = {
            patientId:       patientId,
            dentistId:       parseInt(document.getElementById('dentistId').value),
            treatmentType:   document.getElementById('treatmentType').value,
            appointmentDate: document.getElementById('appointmentDate').value,
            appointmentTime: appointmentTime + ':00',
            notes:           document.getElementById('notes').value,
            contact:         contact,
            createdBy:       parseInt(localStorage.getItem('staffId') || '1')
        };

        if (!data.dentistId || !data.treatmentType || !data.appointmentDate || !data.appointmentTime) {
            errorDiv.textContent = 'Please fill in all required appointment fields.';
            errorDiv.style.display = 'flex';
            btn.disabled = false; btn.textContent = 'Register Appointment';
            return;
        }

        try {
            const res = await apiPost('/appointments', data);
            if (res.error) {
                errorDiv.textContent = res.error;
                errorDiv.style.display = 'flex';
                btn.disabled = false; btn.textContent = 'Register Appointment';
            } else {
                const dentistName = document.getElementById('dentistId').selectedOptions[0]?.textContent || '–';
                const treatmentName = document.getElementById('treatmentType').selectedOptions[0]?.textContent || '–';
                errorDiv.style.display = 'none';
                const successHtml =
                    '<h3 style="margin:0 0 10px;color:var(--success);">🎉 Appointment Registered Successfully!</h3>' +
                    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:0.875rem;margin-bottom:12px;">' +
                        '<div><strong>Appointment No:</strong> ' + res.appointmentNo + '</div>' +
                        '<div><strong>Patient:</strong> ' + (document.getElementById('patientSearch').value || '–') + '</div>' +
                        '<div><strong>Dentist:</strong> ' + dentistName + '</div>' +
                        '<div><strong>Date:</strong> ' + data.appointmentDate + '</div>' +
                        '<div><strong>Time:</strong> ' + data.appointmentTime.substring(0,5) + '</div>' +
                        '<div><strong>Treatment:</strong> ' + treatmentName + '</div>' +
                    '</div>' +
                    '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
                        '<a href="/Frontend/view-appointment.html?no=' + res.appointmentNo + '" class="btn btn-sm btn-primary">View Appointment</a>' +
                        '<button class="btn btn-sm btn-ghost" onclick="resetForm()">Register Another</button>' +
                    '</div>';
                const existing = document.getElementById('apptSuccess');
                if (existing) { existing.innerHTML = successHtml; existing.style.display = 'flex'; }
                else {
                    const div = document.createElement('div');
                    div.id = 'apptSuccess';
                    div.className = 'alert alert-success';
                    div.innerHTML = successHtml;
                    div.style.display = 'flex';
                    document.getElementById('appointmentForm').parentElement.insertBefore(div, document.getElementById('appointmentForm'));
                }
                btn.disabled = false; btn.textContent = 'Register Appointment';
            }
        } catch (e) {
            errorDiv.textContent = 'Failed to register appointment. Check that the backend is running.';
            errorDiv.style.display = 'flex';
            btn.disabled = false; btn.textContent = 'Register Appointment';
        }
    });

    function resetForm() {
        document.getElementById('appointmentForm').reset();
        document.getElementById('error-msg').style.display = 'none';
        clearPatientSelection();
        const existing = document.getElementById('apptSuccess');
        if (existing) existing.style.display = 'none';
        document.getElementById('appointmentDate').min = new Date().toISOString().split('T')[0];
    }

    loadDropdowns();
</script>
</body>
</html>
