<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Appointment - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
</head>
<body>
    <div class="header">
        <h1>Register New Appointment</h1>
    </div>
    <nav class="nav" id="main-nav"></nav>
    <div class="container" style="max-width:700px;">
        <div id="toast-container"></div>
        <div id="error-msg" class="alert alert-error" style="display:none;"></div>

        <div class="card">
            <h2>Step 1: Patient</h2>
            <div style="display:flex; gap:10px; align-items:flex-end; margin-bottom:16px;">
                <div class="form-group" style="flex:1; margin-bottom:0;">
                    <label>Search Patient by NIC</label>
                    <input type="text" id="searchNic" placeholder="Enter NIC">
                </div>
                <button type="button" class="btn btn-primary" onclick="searchPatient()">Search</button>
            </div>
            <div id="patientResult" style="margin-bottom:16px; display:none;" class="alert alert-success"></div>
            <div id="newPatientFields" style="display:none;">
                <div class="form-group"><label>Patient Name *</label><input type="text" id="newPatientName" required></div>
                <div class="form-group"><label>Date of Birth</label><input type="date" id="newPatientDob"></div>
                <div class="form-group"><label>Gender</label><select id="newPatientGender"><option>Male</option><option>Female</option><option>Other</option></select></div>
                <div class="form-group"><label>Address</label><input type="text" id="newPatientAddress"></div>
                <div class="form-group"><label>Contact (10 digits, starts with 0) *</label><input type="text" id="newPatientContact" required placeholder="0712345678"></div>
                <div class="form-group"><label>Email</label><input type="email" id="newPatientEmail"></div>
                <div class="form-group"><label>NIC *</label><input type="text" id="newPatientNic" required></div>
                <div class="form-group"><label>Blood Group</label><input type="text" id="newPatientBlood"></div>
                <div class="form-group"><label>Allergies</label><textarea id="newPatientAllergies" rows="2"></textarea></div>
            </div>
        </div>

        <div class="card">
            <h2>Step 2: Appointment Details</h2>
            <form id="appointmentForm">
                <div class="form-group">
                    <label>Treatment Type *</label>
                    <select id="treatmentType" required>
                        <option value="">Select Treatment</option>
                        <option value="CHKUP">Dental Checkup</option>
                        <option value="EXTRACT">Tooth Extraction</option>
                        <option value="ROOTCANAL">Root Canal Treatment</option>
                        <option value="FILLING">Dental Filling</option>
                        <option value="CLEANING">Teeth Cleaning</option>
                        <option value="WHITENING">Teeth Whitening</option>
                        <option value="CROWN">Dental Crown</option>
                        <option value="BRACES">Braces (Orthodontics)</option>
                        <option value="IMPLANT">Dental Implant</option>
                        <option value="WISDOM">Wisdom Tooth Removal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Dentist *</label>
                    <select id="dentistId" required>
                        <option value="">Select Dentist</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Appointment Date *</label>
                    <input type="date" id="appointmentDate" required>
                </div>
                <div class="form-group">
                    <label>Appointment Time (08:00 - 18:00) *</label>
                    <input type="time" id="appointmentTime" required min="08:00" max="18:00">
                </div>
                <div class="form-group">
                    <label>Contact Number (10 digits, starts with 0) *</label>
                    <input type="text" id="contact" required placeholder="0712345678" maxlength="10">
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notes" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Register Appointment</button>
                <a href="/Frontend/dashboard" class="btn" style="background:var(--gray-200); margin-left:10px;">Cancel</a>
            </form>
        </div>
    </div>
    <script src="/Frontend/js/app.js"></script>
    <script>
        let selectedPatientId = null;

        async function loadDentists() {
            try {
                const dentists = await apiGet('/dentists');
                const select = document.getElementById('dentistId');
                dentists.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.dentist_id;
                    opt.textContent = d.name + ' - ' + d.specialization;
                    select.appendChild(opt);
                });
            } catch (e) { console.error(e); }
        }
        loadDentists();

        async function searchPatient() {
            const nic = document.getElementById('searchNic').value.trim();
            if (!nic) { showToast('Please enter NIC', 'error'); return; }
            try {
                const p = await apiGet('/patients/nic/' + encodeURIComponent(nic));
                selectedPatientId = p.patient_id;
                document.getElementById('newPatientFields').style.display = 'none';
                document.getElementById('patientResult').style.display = 'block';
                document.getElementById('patientResult').textContent = 'Found: ' + p.name + ' (ID: ' + p.patient_id + ')';
                document.getElementById('patientResult').className = 'alert alert-success';
            } catch (e) {
                selectedPatientId = null;
                document.getElementById('patientResult').style.display = 'block';
                document.getElementById('patientResult').textContent = 'Patient not found. Please enter new patient details below.';
                document.getElementById('patientResult').className = 'alert alert-warning';
                document.getElementById('newPatientFields').style.display = 'block';
            }
        }

        document.getElementById('appointmentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errorDiv = document.getElementById('error-msg');
            errorDiv.style.display = 'none';

            let patientId = selectedPatientId;

            if (patientId == null) {
                const newPatient = {
                    name: document.getElementById('newPatientName').value,
                    date_of_birth: document.getElementById('newPatientDob').value,
                    gender: document.getElementById('newPatientGender').value,
                    address: document.getElementById('newPatientAddress').value,
                    contact: document.getElementById('newPatientContact').value,
                    email: document.getElementById('newPatientEmail').value,
                    nic: document.getElementById('newPatientNic').value,
                    blood_group: document.getElementById('newPatientBlood').value,
                    allergies: document.getElementById('newPatientAllergies').value
                };
                if (!newPatient.name || !newPatient.nic || !newPatient.contact) {
                    showToast('Please fill in all required patient fields', 'error');
                    return;
                }
                try {
                    const created = await apiPost('/patients', newPatient);
                    if (created.error) { showToast(created.error, 'error'); return; }
                    patientId = created.patient_id;
                    showToast('Patient registered: ' + created.patient_id);
                } catch (err) { showToast('Failed to register patient', 'error'); return; }
            }

            const data = {
                patient_id: patientId,
                dentist_id: parseInt(document.getElementById('dentistId').value),
                treatment_type: document.getElementById('treatmentType').value,
                appointment_date: document.getElementById('appointmentDate').value,
                appointment_time: document.getElementById('appointmentTime').value + ':00',
                notes: document.getElementById('notes').value,
                contact: document.getElementById('contact').value,
                created_by: parseInt(localStorage.getItem('staffId') || '1')
            };

            try {
                const res = await apiPost('/appointments', data);
                if (res.appointmentNo) {
                    showToast('Appointment registered successfully: ' + res.appointmentNo);
                    setTimeout(() => window.location.href = '/Frontend/api/appointments?action=search&appointment_no=' + res.appointmentNo, 1000);
                } else if (res.error) {
                    errorDiv.textContent = res.error;
                    errorDiv.style.display = 'block';
                }
            } catch (e) {
                errorDiv.textContent = 'Failed to create appointment';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
