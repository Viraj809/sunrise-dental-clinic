<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Receipt – Sunrise Dental Clinic</title>
  <meta name="description" content="Official payment receipt from Sunrise Dental Clinic, Sri Lanka.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Frontend/css/style.css">
  <style>
    /* ── Receipt-specific resets ─────────────────────────── */
    body { background: #f0f4f8; font-family: 'Inter', system-ui, sans-serif; }

    /* No-print controls */
    .receipt-controls {
      max-width: 720px;
      margin: 24px auto 0;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .receipt-controls .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: white;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.875rem;
      font-weight: 600;
      color: #334155;
      text-decoration: none;
      transition: all 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .receipt-controls .btn-back:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }

    .receipt-controls .btn-print {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 22px;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(37,99,235,0.30);
      font-family: 'Inter', sans-serif;
    }
    .receipt-controls .btn-print:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.40); }

    /* ── Outer wrapper ───────────────────────────────────── */
    .receipt-wrapper {
      max-width: 720px;
      margin: 20px auto 48px;
      padding: 0 20px;
    }

    /* Loading / error states */
    .receipt-loading {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    /* ── Main Receipt Card ───────────────────────────────── */
    .rx-card {
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(14,35,90,0.13), 0 2px 8px rgba(14,35,90,0.06);
      position: relative;
    }

    /* ── Header Band ─────────────────────────────────────── */
    .rx-header {
      background: linear-gradient(135deg, #0f2d72 0%, #1e40af 50%, #2563eb 100%);
      padding: 36px 40px 28px;
      position: relative;
      overflow: hidden;
    }

    /* Decorative curved accent top-right */
    .rx-header::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 220px; height: 220px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }
    .rx-header::after {
      content: '';
      position: absolute;
      bottom: -80px; right: 60px;
      width: 180px; height: 180px;
      background: rgba(255,255,255,0.04);
      border-radius: 50%;
    }

    .rx-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }

    .rx-brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .rx-brand-icon {
      width: 66px; height: 66px;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.22);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    .rx-brand-icon svg { width: 36px; height: 36px; }

    .rx-brand-text { color: white; }

    .rx-brand-name {
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      line-height: 1.1;
      margin: 0;
    }

    .rx-brand-tagline {
      font-size: 0.8rem;
      opacity: 0.75;
      font-weight: 400;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rx-brand-tagline::before,
    .rx-brand-tagline::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.35);
    }

    /* Bill number badge */
    .rx-bill-badge {
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 14px;
      padding: 12px 20px;
      text-align: center;
      backdrop-filter: blur(10px);
      color: white;
      flex-shrink: 0;
    }
    .rx-bill-badge-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.75;
      display: block;
    }
    .rx-bill-badge-no {
      font-size: 1.7rem;
      font-weight: 900;
      line-height: 1.1;
      display: block;
    }

    /* Contact strip */
    .rx-contact-strip {
      display: flex;
      align-items: center;
      gap: 0;
      margin-top: 22px;
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px;
      overflow: hidden;
    }

    .rx-contact-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      flex: 1;
      color: rgba(255,255,255,0.88);
      font-size: 0.8rem;
      font-weight: 500;
    }

    .rx-contact-item + .rx-contact-item {
      border-left: 1px solid rgba(255,255,255,0.14);
    }

    .rx-contact-item svg {
      width: 15px; height: 15px;
      stroke: rgba(255,255,255,0.7);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ── "Official Receipt" Title ────────────────────────── */
    .rx-title-bar {
      background: #f8fafc;
      border-bottom: 1.5px solid #e8edf5;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .rx-title-dot {
      width: 7px; height: 7px;
      background: #2563eb;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .rx-title-text {
      font-size: 1.05rem;
      font-weight: 800;
      color: #1e3a8a;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    /* ── Body ────────────────────────────────────────────── */
    .rx-body {
      padding: 32px 40px;
    }

    /* Detail rows with icon */
    .rx-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      margin-bottom: 28px;
    }

    .rx-detail-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .rx-detail-row:nth-last-child(-n+2) { border-bottom: none; }

    .rx-detail-row.full-width {
      grid-column: 1 / -1;
    }

    .rx-detail-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .rx-detail-icon svg {
      width: 17px; height: 17px;
      stroke: #2563eb;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .rx-detail-content { flex: 1; min-width: 0; }

    .rx-detail-label {
      font-size: 0.72rem;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 2px;
    }

    .rx-detail-value {
      font-size: 0.92rem;
      font-weight: 700;
      color: #1e293b;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rx-detail-value.primary { color: #2563eb; }

    /* ── Fee Table ───────────────────────────────────────── */
    .rx-fee-table {
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid #e2e8f0;
      margin-bottom: 28px;
    }

    .rx-fee-thead {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      padding: 13px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rx-fee-thead span {
      font-size: 0.78rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .rx-fee-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 20px;
      border-bottom: 1px dashed #e8edf5;
      transition: background 0.15s;
    }

    .rx-fee-row:last-child { border-bottom: none; }
    .rx-fee-row:hover { background: #f8fafc; }

    .rx-fee-desc {
      font-size: 0.88rem;
      color: #334155;
      font-weight: 500;
    }

    .rx-fee-amount {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1e293b;
    }

    .rx-fee-amount.discount { color: #16a34a; }

    /* Total row */
    .rx-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border-top: 2px solid #2563eb;
    }

    .rx-total-label {
      font-size: 1rem;
      font-weight: 800;
      color: #1e3a8a;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .rx-total-amount {
      font-size: 1.3rem;
      font-weight: 900;
      color: #1e3a8a;
    }

    /* ── Payment Section ─────────────────────────────────── */
    .rx-payment-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 24px;
      background: #f8fafc;
      border-radius: 14px;
      border: 1.5px solid #e8edf5;
      margin-bottom: 28px;
    }

    .rx-payment-details { display: flex; flex-direction: column; gap: 12px; flex: 1; }

    .rx-payment-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .rx-payment-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .rx-payment-icon svg {
      width: 16px; height: 16px;
      stroke: #2563eb;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .rx-payment-info { display: flex; flex-direction: column; }

    .rx-payment-label {
      font-size: 0.7rem;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .rx-payment-value {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1e293b;
    }

    /* PAID stamp */
    .rx-paid-stamp {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 3.5px dashed #16a34a;
      position: relative;
      flex-shrink: 0;
    }

    .rx-paid-stamp-inner {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #dcfce7, #bbf7d0);
      border: 2px solid #16a34a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .rx-paid-stamp-top {
      font-size: 0.58rem;
      font-weight: 800;
      color: #15803d;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .rx-paid-stamp-main {
      font-size: 1.35rem;
      font-weight: 900;
      color: #15803d;
      letter-spacing: 2px;
      line-height: 1;
    }

    .rx-paid-stamp-bottom {
      font-size: 0.48rem;
      font-weight: 700;
      color: #15803d;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-align: center;
    }

    /* PENDING badge */
    .rx-pending-badge {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 0.9rem;
      font-weight: 800;
      color: #92400e;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    /* ── Footer Wave ─────────────────────────────────────── */
    .rx-footer {
      background: linear-gradient(135deg, #0f2d72 0%, #1e40af 50%, #2563eb 100%);
      padding: 0;
      position: relative;
      overflow: hidden;
    }

    .rx-footer-wave {
      width: 100%;
      display: block;
      margin-bottom: -2px;
      fill: #ffffff;
    }

    .rx-footer-content {
      padding: 10px 40px 28px;
      position: relative;
      z-index: 1;
    }

    .rx-footer-thank {
      text-align: center;
      margin-bottom: 18px;
    }

    .rx-footer-thank-sub {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.7);
      font-weight: 400;
    }

    .rx-footer-thank-name {
      font-size: 1.3rem;
      font-weight: 900;
      color: white;
      margin: 4px 0 2px;
    }

    .rx-footer-thank-tag {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .rx-footer-thank-tag::before,
    .rx-footer-thank-tag::after {
      content: '';
      flex: 1;
      height: 1px;
      max-width: 60px;
      background: rgba(255,255,255,0.3);
    }

    .rx-footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.15);
      gap: 10px;
      flex-wrap: wrap;
    }

    .rx-footer-bar-item {
      display: flex;
      align-items: center;
      gap: 7px;
      color: rgba(255,255,255,0.8);
      font-size: 0.78rem;
      font-weight: 500;
    }

    .rx-footer-bar-item svg {
      width: 14px; height: 14px;
      stroke: rgba(255,255,255,0.65);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ── Print Styles ────────────────────────────────────── */
    @media print {
      body { background: white !important; }
      .receipt-controls { display: none !important; }
      .header.no-print, nav.no-print { display: none !important; }
      .no-print { display: none !important; }
      .receipt-wrapper { margin: 0; padding: 0; max-width: 100%; }
      .rx-card { box-shadow: none !important; border-radius: 0; }
    }

    @media (max-width: 640px) {
      .rx-header { padding: 24px 20px 18px; }
      .rx-body { padding: 22px 20px; }
      .rx-detail-grid { grid-template-columns: 1fr; }
      .rx-detail-row:nth-last-child(-n+2) { border-bottom: 1px solid #f1f5f9; }
      .rx-detail-row:last-child { border-bottom: none; }
      .rx-contact-strip { flex-direction: column; }
      .rx-contact-item + .rx-contact-item { border-left: none; border-top: 1px solid rgba(255,255,255,0.14); }
      .rx-payment-section { flex-direction: column; align-items: flex-start; }
      .rx-paid-stamp { align-self: center; }
      .rx-footer-content { padding: 10px 20px 22px; }
      .rx-title-bar { padding: 14px 20px; }
      .rx-title-text { letter-spacing: 1.5px; font-size: 0.9rem; }
      .rx-fee-table { border-radius: 10px; }
      .receipt-controls { padding: 0 16px; }
    }
  </style>
</head>
<body>

<!-- App header (non-print) -->
<div class="header no-print">
  <h1>Sunrise Dental Clinic</h1>
  <div class="user-info" id="user-info"></div>
</div>
<nav class="nav no-print" id="main-nav"></nav>

<!-- Controls bar -->
<div class="receipt-controls no-print">
  <a href="/Frontend/billing.html" class="btn-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12 19 5 12 12 5"/>
    </svg>
    Back to Billing
  </a>
  <button class="btn-print" onclick="window.print()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 6 2 18 2 18 9"/>
      <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
      <rect x="6" y="14" width="12" height="8"/>
    </svg>
    Print Receipt
  </button>
</div>

<!-- Receipt wrapper -->
<div class="receipt-wrapper">
  <div id="toast-container"></div>
  <div id="billContent">
    <div class="receipt-loading">
      <div class="spinner"></div>
      <p style="margin-top:16px; font-size:0.95rem;">Loading receipt…</p>
    </div>
  </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const billId = params.get('bill_id');
  const apptId = params.get('appt_id');

  async function loadBill() {
    try {
      let b;
      if (billId) {
        b = await apiGet('/bills/' + billId + '/receipt');
      } else if (apptId) {
        b = await apiGet('/bills/appointment/' + apptId + '/receipt');
      } else {
        document.getElementById('billContent').innerHTML =
          '<div class="rx-card" style="padding:32px;text-align:center;color:#dc2626;">No bill ID or appointment ID specified in URL.</div>';
        return;
      }
      renderReceipt(b);
    } catch (e) {
      document.getElementById('billContent').innerHTML =
        '<div class="rx-card" style="padding:32px;text-align:center;color:#dc2626;">❌ Bill not found or could not be loaded.</div>';
    }
  }

  function fmt(n) {
    return 'LKR ' + Number(n).toLocaleString('en-LK', { minimumFractionDigits: 2 });
  }

  function renderReceipt(b) {
    const isPaid = b.paymentStatus === 'PAID';

    const discountRow = (b.discount > 0) ? `
      <div class="rx-fee-row">
        <span class="rx-fee-desc">Senior Citizen Discount (10%)</span>
        <span class="rx-fee-amount discount">− ${fmt(b.discount)}</span>
      </div>` : '';

    const paymentStatusHtml = isPaid
      ? `<div class="rx-paid-stamp">
           <div class="rx-paid-stamp-inner">
             <span class="rx-paid-stamp-top">Thank You</span>
             <span class="rx-paid-stamp-main">PAID</span>
             <span class="rx-paid-stamp-bottom">For Your Visit</span>
           </div>
         </div>`
      : `<div class="rx-pending-badge">⏳ PENDING</div>`;

    document.getElementById('billContent').innerHTML = `
      <div class="rx-card">

        <!-- ═══ HEADER ═══ -->
        <div class="rx-header">
          <div class="rx-header-inner">
            <div class="rx-brand">
              <div class="rx-brand-icon">
                <!-- Tooth SVG -->
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 4C16.5 4 13 6.5 11 9C9.5 6.5 7 5 5 5C3 5 1.5 7 1.5 10C1.5 14 4 19 6 23
                           C7 25 8 28 8.5 31C9 34 9.5 36 11.5 36C13.5 36 14 33 15 30C16 27 17.5 25 20 25
                           C22.5 25 24 27 25 30C26 33 26.5 36 28.5 36C30.5 36 31 34 31.5 31
                           C32 28 33 25 34 23C36 19 38.5 14 38.5 10C38.5 7 37 5 35 5
                           C33 5 30.5 6.5 29 9C27 6.5 23.5 4 20 4Z"
                        fill="white" fill-opacity="0.92"/>
                </svg>
              </div>
              <div class="rx-brand-text">
                <p class="rx-brand-name">Sunrise Dental Clinic</p>
                <p class="rx-brand-tagline">Healthy Smile, Brighter Life</p>
              </div>
            </div>
            <div class="rx-bill-badge">
              <span class="rx-bill-badge-label">Bill No.</span>
              <span class="rx-bill-badge-no">#${b.billId}</span>
            </div>
          </div>

          <!-- Contact Strip -->
          <div class="rx-contact-strip">
            <div class="rx-contact-item">
              <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              123 Dental Road, Colombo 07
            </div>
            <div class="rx-contact-item">
              <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.07 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3 1.18h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 8 8l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 17z"/></svg>
              +94 11 234 5678
            </div>
            <div class="rx-contact-item">
              <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              info@sunrisedental.lk
            </div>
          </div>
        </div>

        <!-- ═══ RECEIPT TITLE ═══ -->
        <div class="rx-title-bar">
          <span class="rx-title-dot"></span>
          <span class="rx-title-text">Official Receipt</span>
          <span class="rx-title-dot"></span>
        </div>

        <!-- ═══ BODY ═══ -->
        <div class="rx-body">

          <!-- Detail grid -->
          <div class="rx-detail-grid">

            <div class="rx-detail-row">
              <div class="rx-detail-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              </div>
              <div class="rx-detail-content">
                <span class="rx-detail-label">Appointment No.</span>
                <span class="rx-detail-value primary">${b.appointmentNo || '–'}</span>
              </div>
            </div>

            <div class="rx-detail-row">
              <div class="rx-detail-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              </div>
              <div class="rx-detail-content">
                <span class="rx-detail-label">Date</span>
                <span class="rx-detail-value">${b.appointmentDate || '–'} ${(b.appointmentTime || '').substring(0, 5)}</span>
              </div>
            </div>

            <div class="rx-detail-row">
              <div class="rx-detail-icon">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
              <div class="rx-detail-content">
                <span class="rx-detail-label">Patient</span>
                <span class="rx-detail-value">${b.patientName || '–'}</span>
              </div>
            </div>

            <div class="rx-detail-row">
              <div class="rx-detail-icon">
                <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.07 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3 1.18h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 8 8l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 17z"/></svg>
              </div>
              <div class="rx-detail-content">
                <span class="rx-detail-label">Contact</span>
                <span class="rx-detail-value">${b.patientContact || '–'}</span>
              </div>
            </div>

            <div class="rx-detail-row">
              <div class="rx-detail-icon">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
              <div class="rx-detail-content">
                <span class="rx-detail-label">Dentist</span>
                <span class="rx-detail-value">${b.dentistName || '–'}${b.dentistSpecialization ? ' (' + b.dentistSpecialization + ')' : ''}</span>
              </div>
            </div>

            <div class="rx-detail-row">
              <div class="rx-detail-icon">
                <!-- Tooth icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.5">
                  <path d="M12 2.5C10.4 2.5 9 3.5 8 4.8C7.2 3.5 6 2.7 5 2.7C3.9 2.7 3 3.8 3 5.2
                           C3 7.3 4.3 9.8 5.3 11.8C5.8 12.8 6.3 14.2 6.6 15.6C6.9 17 7.1 18 8.1 18
                           C9.1 18 9.3 16.8 9.8 15.4C10.3 14 11.1 13 12 13C12.9 13 13.7 14 14.2 15.4
                           C14.7 16.8 14.9 18 15.9 18C16.9 18 17.1 17 17.4 15.6C17.7 14.2 18.2 12.8 18.7 11.8
                           C19.7 9.8 21 7.3 21 5.2C21 3.8 20.1 2.7 19 2.7C18 2.7 16.8 3.5 16 4.8C15 3.5 13.6 2.5 12 2.5Z"/>
                </svg>
              </div>
              <div class="rx-detail-content">
                <span class="rx-detail-label">Treatment</span>
                <span class="rx-detail-value">${b.treatmentName || b.treatmentCode || '–'}</span>
              </div>
            </div>

          </div>

          <!-- Fee Table -->
          <div class="rx-fee-table">
            <div class="rx-fee-thead">
              <span>Description</span>
              <span>Amount (LKR)</span>
            </div>
            <div class="rx-fee-row">
              <span class="rx-fee-desc">Consultation Fee</span>
              <span class="rx-fee-amount">${fmt(b.consultationFee)}</span>
            </div>
            <div class="rx-fee-row">
              <span class="rx-fee-desc">Treatment Fee</span>
              <span class="rx-fee-amount">${fmt(b.treatmentFee)}</span>
            </div>
            ${discountRow}
            <div class="rx-fee-row">
              <span class="rx-fee-desc">Tax (5%)</span>
              <span class="rx-fee-amount">${fmt(b.tax)}</span>
            </div>
            <div class="rx-total-row">
              <span class="rx-total-label">Total</span>
              <span class="rx-total-amount">${fmt(b.totalAmount)}</span>
            </div>
          </div>

          <!-- Payment section -->
          <div class="rx-payment-section">
            <div class="rx-payment-details">
              <div class="rx-payment-row">
                <div class="rx-payment-icon">
                  <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                </div>
                <div class="rx-payment-info">
                  <span class="rx-payment-label">Payment Method</span>
                  <span class="rx-payment-value">${b.paymentMethod || '–'}</span>
                </div>
              </div>
              <div class="rx-payment-row">
                <div class="rx-payment-icon">
                  <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
                <div class="rx-payment-info">
                  <span class="rx-payment-label">Payment Status</span>
                  <span class="rx-payment-value">${b.paymentStatus || '–'}</span>
                </div>
              </div>
              ${b.issuedAt ? `<div class="rx-payment-row">
                <div class="rx-payment-icon">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <div class="rx-payment-info">
                  <span class="rx-payment-label">Issued At</span>
                  <span class="rx-payment-value">${b.issuedAt.substring(0, 19).replace('T', ' ')}</span>
                </div>
              </div>` : ''}
            </div>
            ${paymentStatusHtml}
          </div>

        </div><!-- /.rx-body -->

        <!-- ═══ FOOTER ═══ -->
        <div class="rx-footer">
          <!-- Wave divider -->
          <svg class="rx-footer-wave" viewBox="0 0 720 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,20 C120,40 240,0 360,20 C480,40 600,0 720,20 L720,0 L0,0 Z" fill="white"/>
          </svg>
          <div class="rx-footer-content">
            <div class="rx-footer-thank">
              <p class="rx-footer-thank-sub">Thank you for choosing</p>
              <p class="rx-footer-thank-name">Sunrise Dental Clinic.</p>
              <p class="rx-footer-thank-tag">We care for your smile.</p>
            </div>
            <div class="rx-footer-bar">
              <div class="rx-footer-bar-item">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Mon – Sat: 9:00 AM – 6:00 PM
              </div>
              <div class="rx-footer-bar-item">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                www.sunrisedental.lk
              </div>
              <div class="rx-footer-bar-item">
                <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                info@sunrisedental.lk
              </div>
            </div>
          </div>
        </div>

      </div><!-- /.rx-card -->
    `;
  }

  loadBill();
</script>
</body>
</html>
