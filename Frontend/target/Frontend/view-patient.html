<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Patient – Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/Frontend/css/style.css">
</head>
<body>
<div class="header">
    <h1>Sunrise Dental Clinic</h1>
    <div class="user-info" id="user-info"></div>
</div>
<div class="sticky-nav">
    <nav class="nav" id="main-nav"></nav>
</div>

<div class="container" style="max-width:720px;">
    <div id="toast-container"></div>

    <div class="page-header">
        <div><h2>Patient Details</h2><p id="patientSubtitle">Loading patient details...</p></div>
        <a href="/Frontend/manage-patients.html" class="btn btn-ghost btn-sm">← Back to Patients</a>
    </div>

    <div id="loadError" class="alert alert-error" style="display:none;"></div>

    <div class="card" id="patientCard" style="display:none;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div>
                <p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Patient ID</p>
                <p style="font-size:1.1rem;font-weight:700;color:var(--primary);" id="v-patientId"></p>
            </div>
            <div>
                <p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Full Name</p>
                <p style="font-weight:700;" id="v-name"></p>
            </div>
            <div>
                <p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">NIC</p>
                <p style="font-weight:600;" id="v-nic"></p>
            </div>
            <div>
                <p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Date of Birth</p>
                <p style="font-weight:600;" id="v-dob"></p>
            </div>
            <div>
                <p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Gender</p>
                <p style="font-weight:600;" id="v-gender"></p>
            </div>
            <div>
                <p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Contact</p>
                <p style="font-weight:600;" id="v-contact"></p>
            </div>
            <div>
                <p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Email</p>
                <p style="font-weight:600;" id="v-email"></p>
            </div>
            <div>
                <p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Address</p>
                <p style="font-weight:600;" id="v-address"></p>
            </div>
            <div style="grid-column:1/-1;">
                <p style="color:var(--text-muted);font-size:0.8rem;font-weight:600;text-transform:uppercase;">Known Allergies</p>
                <p style="font-weight:600;" id="v-allergies"></p>
            </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;">
            <a id="v-editLink" href="#" class="btn btn-warning">
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                Edit
            </a>
            <a id="v-historyLink" href="#" class="btn btn-primary">
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                History
            </a>
            <a id="v-bookLink" href="#" class="btn btn-success">
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Book Appointment
            </a>
        </div>
    </div>
</div>

<script src="/Frontend/js/app.js"></script>
<script>
    requireAuth();

    const params = new URLSearchParams(window.location.search);
    const patientId = params.get('patient_id');

    function formatPatientId(id) {
        return 'P' + String(id).padStart(3, '0');
    }

    async function loadPatient() {
        if (!patientId) {
            document.getElementById('loadError').textContent = 'No patient_id specified in URL.';
            document.getElementById('loadError').style.display = 'flex';
            return;
        }
        try {
            const p = await apiGet('/patients/' + patientId);
            document.getElementById('patientSubtitle').textContent = p.name;
            document.getElementById('v-patientId').textContent = formatPatientId(p.patientId);
            document.getElementById('v-name').textContent = p.name || '–';
            document.getElementById('v-nic').textContent = p.nic || '–';
            document.getElementById('v-dob').textContent = p.dateOfBirth || '–';
            document.getElementById('v-gender').textContent = p.gender || '–';
            document.getElementById('v-contact').textContent = p.contact || '–';
            document.getElementById('v-email').textContent = p.email || '–';
            document.getElementById('v-address').textContent = p.address || '–';
            document.getElementById('v-allergies').textContent = p.allergies || 'None';

            document.getElementById('v-editLink').href = '/Frontend/edit-patient.html?patient_id=' + p.patientId;
            document.getElementById('v-historyLink').href = '/Frontend/patient-history.html?patient_id=' + p.patientId;
            document.getElementById('v-bookLink').href = '/Frontend/register-appointment.html?patientId=' + p.patientId;

            document.getElementById('patientCard').style.display = 'block';
        } catch (e) {
            document.getElementById('loadError').textContent = 'Patient not found (ID: ' + patientId + ')';
            document.getElementById('loadError').style.display = 'flex';
        }
    }

    loadPatient();
</script>
</body>
</html>
